<style>
:root{
--mamey:#F59E0B;--bg:#F9FAFB;--card:#fff;--text:#111827;
}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
header{text-align:center;padding:40px 15px;background:#0b1633;color:#fff}
header h1{color:var(--mamey);font-size:42px;margin:0}
.views{font-size:14px;margin-top:6px}

.search-box{margin:20px auto;max-width:520px}
.search-box form{display:flex}
.search-box input{flex:1;padding:12px;border:none;border-radius:10px 0 0 10px}
.search-box button{padding:12px 18px;border:none;background:var(--mamey);font-weight:bold;border-radius:0 10px 10px 0}

.controls select{padding:6px;border-radius:6px;margin:4px}

.section-title{text-align:center;margin:55px 0 22px;font-size:26px;font-weight:700;color:var(--mamey)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:20px;padding:0 20px 40px}
.card{background:#fff;border-radius:18px;padding:26px 15px;text-align:center;text-decoration:none;box-shadow:0 10px 25px rgba(0,0,0,.08);transition:.25s}
.card:hover{transform:translateY(-6px)}
.card span{font-size:17px;font-weight:700}

/* Carrusel */
#adCarousel{display:flex;gap:20px;overflow-x:auto;padding:20px}
.ad-card{min-width:260px;background:#0b1633;color:#fff;border-radius:18px;padding:14px}
.ad-card img{width:100%;border-radius:12px}

/* Botón */
#publishBtn{display:block;margin:0 auto 40px;padding:14px 28px;background:var(--mamey);border:none;border-radius:14px;font-weight:bold;cursor:pointer}

/* Modal */
#offerModal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:999;align-items:center;justify-content:center}
#offerModal form{background:#fff;padding:30px;border-radius:18px;max-width:420px;width:90%}
#offerModal h3{margin-top:0;color:var(--mamey)}
#offerModal input,#offerModal button{width:100%;padding:12px;margin-top:10px}
#offerModal button[type="button"]{background:#eee}

footer{background:#eef2f7;padding:40px;text-align:center;font-size:14px}
footer a{color:var(--mamey);text-decoration:none}

const db=firebase.firestore();

/* ================= VISTAS ================= */
const viewsEl=document.getElementById("viewsCounter");
db.collection("stats").doc("views").get().then(d=>{
let v=d.exists?d.data().count:0;
v++;
viewsEl.textContent="Visitas: "+v.toLocaleString();

});

/* ================= BUSCADOR ================= */
function buscar(e){
e.preventDefault();
window.open("https://www.google.com/search?q="+encodeURIComponent(searchInput.value+" ofertas"),"_blank");
}

/* ================= IDIOMAS ================= */
function setLanguage(l){
offersTitle.textContent =
l==="EN" ? "Deals For You" :
l==="PT" ? "Ofertas Para Você" :
"Ofertas Para Ti";
}

/* ================= MODAL ================= */
function openOfferModal(){offerModal.style.display="flex";}
function closeOfferModal(){offerModal.style.display="none";}

/* ================= PUBLICAR IMAGEN (CLOUDINARY) ================= */
function publicarImagen(e){
  e.preventDefault();

  const file = document.getElementById("imagenOferta").files[0];
  if(!file){
    alert("Debes subir una imagen");
    return;
  }

  const formData = new FormData();
  formData.append("file", file);
  formData.append("upload_preset", "ofertas_publicas"); // ✅ PRESET REAL

  fetch("https://api.cloudinary.com/v1_1/dveqauvqh/image/upload", { // ✅ CLOUD NAME REAL
    method: "POST",
    body: formData
  })
  .then(res => res.json())
  .then(data => {
    if(!data.secure_url){
      console.error(data);
      alert("Cloudinary rechazó la imagen");
      return;
    }

    db.collection("publicidad").add({
      imagen: data.secure_url,
      fecha: firebase.firestore.FieldValue.serverTimestamp()
    });

    closeOfferModal();
    alert("Imagen publicada correctamente ✅");
  })
  .catch(err => {
    console.error(err);
    alert("Error al subir la imagen");
  });
  return false;
}
  
/* ================= CARRUSEL ================= */
function loadAds(){
db.collection("publicidad").orderBy("fecha","desc").onSnapshot(s=>{
adCarousel.innerHTML="";
s.forEach(d=>{
adCarousel.innerHTML+=`
<div class="ad-card">
<img src="${d.data().imagen}" loading="lazy">
</div>`;
});
});
}
loadAds();

function renderSections(){
const content=document.getElementById("content");
content.innerHTML="";
Object.entries(SECTIONS).forEach(([section,stores])=>{
let html=`<h2 class="section-title">${section}</h2><div class="grid">`;

html+=`<a class="card ${cls}" href="${url}" target="_blank"><span>${name}</span></a>`;
});
content.innerHTML+=html+"</div>";
});
}
