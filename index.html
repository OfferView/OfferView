<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>OfferView – Tu Guía a las Mejores Ofertas</title>
<meta name="description" content="OfferView es una guía global e independiente que te ayuda a encontrar las mejores ofertas en tiendas online confiables.">
<meta name="keywords" content="ofertas, tiendas online, descuentos, Amazon, Temu, AliExpress">
<meta name="author" content="OfferView">
<meta name="robots" content="index, follow">

<style>
:root{
--mamey:#F59E0B;--bg:#F9FAFB;--card:#fff;--text:#111827;
}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
header{text-align:center;padding:45px 15px;background:#0b1633;color:#fff}
header h1{color:var(--mamey);font-size:42px;margin:0}
.logo-offerview{width:180px;margin-bottom:15px}
.views{font-size:14px}
.search-box{margin:25px auto;max-width:520px}
.search-box form{display:flex}
.search-box input{flex:1;padding:12px;border:none;border-radius:10px 0 0 10px}
.search-box button{padding:12px 18px;border:none;background:var(--mamey);font-weight:bold;border-radius:0 10px 10px 0}
.controls select{padding:6px;border-radius:6px;margin:4px}

.section-title{text-align:center;margin:50px 0 22px;font-size:26px;font-weight:700;color:var(--mamey)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:20px;padding:0 20px 40px}
.card{background:#fff;border-radius:18px;padding:26px 15px;text-align:center;text-decoration:none;box-shadow:0 10px 25px rgba(0,0,0,.08);transition:.25s}
.card:hover{transform:translateY(-6px)}
.card span{font-size:18px;font-weight:700}

/* Colores tiendas */
.amazon{color:#FF9900}.temu{color:#FB7701}.aliexpress{color:#FF4747}
.ebay{color:#0064D2}.walmart{color:#0071CE}.target{color:#CC0000}
.costco{color:#E31837}.bestbuy{color:#003B64}.newegg{color:#F28C28}
.etsy{color:#F1641E}.shein{color:#111}.shopee{color:#EE4D2D}
.miniso{color:#E50012}.ross{color:#1B75BC}.marshalls{color:#00539B}
.burlington{color:#00539B}.ikea{color:#0058A3}.rakuten{color:#BF0000}
.coppel{color:#005AA9}.falabella{color:#0072CE}
.magalu{color:#0086FF}.americanas{color:#E60014}
.linio{color:#00AEEF}.mercadolibre{color:#FFE600}

footer{background:#eef2f7;padding:40px;text-align:center;font-size:14px}
footer a{color:var(--mamey);text-decoration:none}

/* Publicidad */
#adCarousel{display:flex;gap:20px;overflow-x:auto;padding:20px}
.ad-card{min-width:260px;background:#0b1633;color:#fff;border-radius:18px;padding:14px}
.ad-card img{width:100%;border-radius:12px}
#adBtn{display:block;margin:0 auto 40px;padding:14px 28px;background:var(--mamey);border:none;border-radius:14px;font-weight:bold}
</style>
</head>

<body>

<header>
<img src="pngofferview.jpg" class="logo-offerview">
<h1>OFFERVIEW</h1>
<p id="slogan">Tu Guía a las Mejores Ofertas</p>
<div class="views" id="viewsCounter"></div>

<div class="search-box">
<form onsubmit="return OfferViewIA.search(event)">
<input id="searchInput" placeholder="Buscar tiendas, marcas u ofertas">
<button>Buscar</button>
</form>
</div>

<div class="controls">
<select onchange="OfferViewIA.setCountry(this.value)">
<option value="GLOBAL">🌍 Global</option>
<option value="RD">🇩🇴 RD</option>
<option value="US">🇺🇸 US</option>
<option value="ES">🇪🇸 ES</option>
<option value="MX">🇲🇽 MX</option>
<option value="BR">🇧🇷 BR</option>
</select>
</div>
</header>

<h2 class="section-title">Ofertas Publicadas por Negocios</h2>
<div id="adCarousel"></div>
<button id="adBtn" onclick="openAdModal()">Registro & Publicar Ofertas</button>

<div id="content"></div>

<footer>
<p>OfferView es una guía independiente. Algunos enlaces pueden ser de afiliación.</p>
<p>Contacto: <a href="mailto:soporte.offerviews01@gmail.com">soporte.offerviews01@gmail.com</a></p>
<p>© 2026 OfferView</p>
</footer>

<!-- Modal -->
<div id="adModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.6)">
<div style="background:#fff;max-width:420px;margin:8% auto;padding:22px;border-radius:18px">
<h3>Publicar Oferta</h3>
<input id="adName" placeholder="Negocio" style="width:100%">
<input id="adImg" type="file">
<textarea id="adText" placeholder="Oferta" style="width:100%"></textarea><br><br>
<button onclick="publishAd()">Publicar</button>
<button onclick="adModal.style.display='none'">Cancelar</button>
</div>
</div>

<script>
let v=localStorage.getItem("offerview_views")||25104;
localStorage.setItem("offerview_views",++v);
viewsCounter.textContent="Views: "+v.toLocaleString();

const OfferViewPrompts={
search:"Analiza búsqueda",
intent:"Detecta intención",
recommend:"Recomienda tiendas",
deals:"Prioriza ofertas",
ethics:"Guía independiente"
};

const OfferViewIA={
country:"GLOBAL",
setCountry(c){this.country=c},
search(e){
e.preventDefault();
window.open("https://www.google.com/search?q="+encodeURIComponent(searchInput.value+" ofertas "+this.country),"_blank");
},
affiliate(u){
if(u.includes("temu")) return "https://temu.to/k/gfiiqs13cbu";
return u;
}
};

/* PUBLICIDAD */
function openAdModal(){adModal.style.display="block"}
function publishAd(){
const r=new FileReader();
r.onload=()=>{
const ads=JSON.parse(localStorage.getItem("ov_ads")||"[]");
ads.push({n:adName.value,t:adText.value,i:r.result});
localStorage.setItem("ov_ads",JSON.stringify(ads));
location.reload();
};
r.readAsDataURL(adImg.files[0]);
}
(JSON.parse(localStorage.getItem("ov_ads")||"[]")).forEach(a=>{
adCarousel.innerHTML+=`<div class="ad-card"><img src="${a.i}"><h4>${a.n}</h4><p>${a.t}</p></div>`;
});

/* ================= SECCIONES COMPLETAS ================= */
const SECTIONS={
"Top Stores":[
["Amazon","amazon","https://amazon.com"],
["Mercado Libre","mercadolibre","https://mercadolibre.com"],

["AliExpress","aliexpress","https://aliexpress.com"],
["eBay","ebay","https://ebay.com"],
["Walmart","walmart","https://walmart.com"],
["Target","target","https://target.com"],
["Costco","costco","https://costco.com"],
["Best Buy","bestbuy","https://bestbuy.com"],
["Newegg","newegg","https://newegg.com"],
["Etsy","etsy","https://etsy.com"],
["Shein","shein","https://shein.com"],
["Shopee","shopee","https://shopee.com"],
["MINISO","miniso","https://miniso.com"],
["Ross","ross","https://rossstores.com"],

["Americanas","americanas","https://americanas.com.br"],
["Linio","linio","https://linio.com"]
],

"Gaming Stores":[
["Steam","steam","https://store.steampowered.com"],
["Epic Games","epicgames","https://store.epicgames.com"],

],

"Tecnología Stores":[
["Apple","apple","https://apple.com"],
["Samsung","samsung","https://samsung.com"],
["Microsoft","microsoft","https://microsoft.com"],
["Lenovo","lenovo","https://lenovo.com"],
["Dell","dell","https://dell.com"],
["HP","hp","https://hp.com"],
["Asus","asus","https://asus.com"],
["Acer","acer","https://acer.com"],
["Xiaomi","xiaomi","https://mi.com"],
["Newegg","newegg","https://newegg.com"]
],

"Moda y Lencería Stores":[

["Uniqlo","uniqlo","https://uniqlo.com"],
["Shein","shein","https://shein.com"],

["Aerie","aerie","https://ae.com"],
["Calvin Klein","calvinklein","https://calvinklein.com"],
["Savage X Fenty","savagexfenty","https://savagex.com"],
["Oysho","oysho","https://oysho.com"]
],

"Calzados Stores":[
["Nike","nike","https://nike.com"],

["New Balance","newbalance","https://newbalance.com"],

["Skechers","skechers","https://skechers.com"],

],

"Hoteles y Vuelos Stores":[

["Skyscanner","skyscanner","https://skyscanner.com"],

["Trip.com","tripdotcom","https://trip.com"],
["Hotels.com","hotelsdotcom","https://hotels.com"],
["Priceline","priceline","https://priceline.com"],
["Travelocity","travelocity","https://travelocity.com"]
]
};

for(const section in SECTIONS){
content.innerHTML+=`
<h2 class="section-title">${section}</h2>
<div class="grid">
${SECTIONS[section].map(s=>`
<a class="card" href="${OfferViewIA.affiliate(s[2])}" target="_blank">
<span class="${s[1]}">${s[0]}</span>
</a>`).join("")}
</div>`;
}
</script>
<div id="offerModal" style="
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.6);
z-index:999;
align-items:center;
justify-content:center;
">
  <form onsubmit="registrarOferta(event)" style="
  background:#fff;
  padding:30px;
  border-radius:18px;
  max-width:420px;
  width:90%;
  ">
    <h2 style="margin-top:0;color:#F59E0B">Publicar Oferta</h2>

    <input id="titulo" required placeholder="Título de la oferta"
      style="width:100%;padding:12px;margin:8px 0">

    <textarea id="descripcion" required placeholder="Descripción"
      style="width:100%;padding:12px;margin:8px 0"></textarea>

    <input id="link" required placeholder="Link de la oferta"
      style="width:100%;padding:12px;margin:8px 0">

    <button style="
    width:100%;
    padding:14px;
    background:#F59E0B;
    border:none;
    font-weight:bold;
    border-radius:12px;
    margin-top:10px
    ">Publicar</button>

    <button type="button" onclick="closeModal()" style="
    width:100%;
    padding:10px;
    margin-top:10px;
    background:#eee;
    border:none;
    border-radius:12px
    ">Cancelar</button>
  </form>
</div>
</body>
</html>
