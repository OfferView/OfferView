// ================= SUBIR OFERTA =================
async function subirOferta(){

  const user = auth.currentUser;

  if(!user){
    alert("Debes iniciar sesión");
    return;
  }

const imagen = document.getElementById("imagenOferta").files[0];
const link = document.getElementById("linkOferta").value;
const categoria = document.getElementById("categoriaInput")?.value || "general";
const tienda = document.getElementById("tiendaInput")?.value || "otros";
 
  if(!imagen){
    alert("Debes subir una imagen");
    return;
  }

  try{

    await db.collection("publicidad").add({
      imagen: imagen,
      link: link,
      uid: user.uid,
      email: user.email,
      fecha: new Date(),
      likes: 0,
      categoria: categoria,
      tienda: tienda
    });

    alert("Oferta publicada 🔥");

    cargarOfertas();

  }catch(e){
    console.error(e);
    alert("Error al publicar");
  }
}

// ================= CARGAR OFERTAS =================
async function cargarOfertas(){

const contenedor = document.getElementById("adCarousel");
  contenedor.innerHTML = "Cargando...";

  const user = auth.currentUser;

  try{

    const snapshot = await db.collection("publicidad")
      .orderBy("fecha","desc")
      .get();

    contenedor.innerHTML = "";

    snapshot.forEach(doc => {

      const data = doc.data();
      const id = doc.id;

      const puedeEliminar = user && (data.uid === user.uid || esAdmin(user));

      const card = `
        <div class="oferta-card">
          <img src="${data.imagen}" class="oferta-img">

          ${data.link ? `<a href="${data.link}" target="_blank">Ver oferta</a>` : ""}

          <p>❤️ ${data.likes || 0}</p>

          ${puedeEliminar ? `
            <button onclick="eliminarOferta('${id}')">🗑️ Eliminar</button>
          ` : ""}

        </div>
      `;

      contenedor.innerHTML += card;

    });

  }catch(e){
    console.error(e);
    contenedor.innerHTML = "Error cargando ofertas";
  }
}

// ================= ELIMINAR OFERTA =================
async function eliminarOferta(id){

  const user = auth.currentUser;

  if(!user){
    alert("No autorizado");
    return;
  }

  if(!confirm("¿Eliminar esta oferta?")) return;

  try{

    const docRef = db.collection("publicidad").doc(id);
    const docSnap = await docRef.get();

    if(!docSnap.exists){
      alert("No existe");
      return;
    }

    const data = docSnap.data();

    if(data.uid !== user.uid && !esAdmin(user)){
      alert("No tienes permiso");
      return;
    }

    await docRef.delete();

    alert("Eliminado correctamente");

    cargarOfertas();

  }catch(e){
    console.error(e);
    alert("Error al eliminar");
  }
}

  const ref = db.collection("publicidad").doc(id);

    await ref.update({
      likes: firebase.firestore.FieldValue.increment(1)
    });

    cargarOfertas();

  }catch(e){
    console.error(e);
  }
}

/* ================= PUBLICAR IMAGEN (CLOUDINARY RR SEGURO) ================= */
function publicarImagen(e){
e.preventDefault();

if(!auth.currentUser){
alert("Debes iniciar sesión para publicar");
return;
}

const file = document.getElementById("imagenOferta").files[0];
const linkOferta = document.getElementById("linkOferta").value;

if(!file){
alert("Debes subir una imagen");
return;
}

const formData = new FormData();
formData.append("file", file);
formData.append("upload_preset", "ofertas_publicas");

fetch("https://api.cloudinary.com/v1_1/dveqauvqh/image/upload", {
method: "POST",
body: formData
})
.then(res => res.json())
.then(data => {

if(!data.secure_url){      
  console.error(data);      
  alert("Cloudinary rechazó la imagen");      
  return;      
}      
  
return db.collection("publicidad").add({      
  imagen: data.secure_url,      
  link: linkOferta || null,      
  uid: auth.currentUser.uid, // 🔥 FUNDAMENTAL      
  fecha: firebase.firestore.FieldValue.serverTimestamp()      
});

})
.then(()=>{
closeOfferModal();
alert("Imagen publicada correctamente ✅");

// limpiar campos      
document.getElementById("imagenOferta").value = "";      
document.getElementById("linkOferta").value = "";

})
.catch(err=>{
console.error(err);
alert("Error al subir la imagen");
});

return false;
}

/* ================= CARRUSEL RR OPTIMIZADO ================= */
function loadAds(){

db.collection("publicidad")
.orderBy("fecha","desc")
.onSnapshot(snapshot => {

const adCarousel = document.getElementById("adCarousel");      
  adCarousel.innerHTML = "";      
  
  snapshot.forEach(doc => {      
  
    const data = doc.data();      
    const postId = doc.id;      
  
    const card = document.createElement("div");      
    card.className = "offer-card";      
  
  const imageContainer = document.createElement("div");
imageContainer.className = "offer-image-container";

const img = document.createElement("img");
img.className = "offer-image";
img.src = data.imagen;
img.loading = "lazy";

if(data.link){

  const link = document.createElement("a");
  link.href = data.link;
  link.target = "_blank";

  link.appendChild(img);
  imageContainer.appendChild(link);

}else{

  imageContainer.appendChild(img);

}

card.appendChild(imageContainer)
   
    if(auth.currentUser && (auth.currentUser.uid === data.uid || esAdmin(auth.currentUser))){
    const deleteBtn = document.createElement("button");      
      deleteBtn.className = "delete-btn";      
      deleteBtn.innerHTML = "✖";      
      deleteBtn.onclick = () => eliminarAd(postId);      
      card.appendChild(deleteBtn);      
    }      
  
    const likeBox = document.createElement("div");      
    likeBox.className = "like-box";      
    likeBox.innerHTML = `❤️ <span id="likes-${postId}">0</span>`;      
    likeBox.onclick = () => toggleLike(postId);      
  
    card.appendChild(likeBox);      
    adCarousel.appendChild(card);      
  
    // Contador simple (sin crear múltiples listeners pesados)      
    db.collection("likes")      
      .where("postId","==",postId)      
      .onSnapshot()     
      .then(likesSnapshot=>{      
        const likesEl = document.getElementById("likes-"+postId);      
        if(likesEl){      
          likesEl.textContent = likesSnapshot.size;      
        }      
      });      
  
  });      
  
});

}

loadAds();

function toggleLike(postId){

return;
}

const uid = auth.currentUser.uid;

const likeRef = db.collection("likes")
.where("postId","==",postId)
.where("uid","==",uid);

likeRef.get().then(snapshot=>{
if(snapshot.empty){
db.collection("likes").add({
postId: postId,
uid: uid,
fecha: firebase.firestore.FieldValue.serverTimestamp()
});
}else{
snapshot.forEach(doc=>{

});
}
});

}

/* ================= RENDER STORE CARDS ================= */
function renderStoreCards(){

  const carousel = document.getElementById("storesCarousel");
  carousel.innerHTML = "";

  // 🔥 TODAS LAS TIENDAS DE TODOS LOS MÓDULOS
  const allStores = Object.values(SECTIONS).flat();

  // 🔥 AGRUPAR DE 6 EN 6
  for(let i = 0; i < allStores.length; i += 6){

    const page = document.createElement("div");
    page.className = "stores-page";

    const group = allStores.slice(i, i + 6);

    group.forEach(store => {

      const item = document.createElement("div");
      item.className = "store-chip " + store[1];
      item.textContent = store[0];

      item.onclick = () => {
        window.open(store[2], "_blank");
      };

      page.appendChild(item);

    });

    carousel.appendChild(page);
  }
}

/* ================= MENU HAMBURGUESA ================= */

function toggleMenu() {
  const menu = document.getElementById("sideMenu");
  const overlay = document.getElementById("overlay");

  if (menu.classList.contains("active")) {
    // Cerrar menú
    menu.classList.remove("active");
    overlay.style.display = "none";
  } else {
    // Abrir menú
    menu.classList.add("active");
    overlay.style.display = "block";
  }
}

/* Cerrar menú manualmente */
function closeMenu() {
  document.getElementById("sideMenu").classList.remove("active");
  document.getElementById("overlay").style.display = "none";
}

/* Cerrar menú al tocar fondo oscuro */
document.getElementById("overlay").addEventListener("click", closeMenu);

}
