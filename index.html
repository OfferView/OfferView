<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OfferView – Directorio Global de Tiendas</title>

<!-- SEO -->
<meta name="description" content="OfferView reúne las tiendas más importantes del mundo en un solo lugar.">
<meta name="keywords" content="ofertas, tiendas, ecommerce, marketplace">
<meta name="author" content="OfferView">

<!-- Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-PDM9GCV149"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-PDM9GCV149');
</script>

<style>
:root{
  --mamey:#F59E0B;
  --blue1:#0b1f4d;
  --blue2:#0f3a7a;
  --card:#ffffff;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:linear-gradient(135deg,var(--blue1),var(--blue2));
  color:#fff;
}

/* HEADER */
header{
  padding:18px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:26px;
  font-weight:800;
  color:var(--mamey);
}

nav a{
  color:#fff;
  text-decoration:none;
  margin:0 10px;
  font-size:15px;
}

.search-box{
  max-width:700px;
  margin:20px auto;
  display:flex;
}

.search-box input{
  width:100%;
  padding:14px 18px;
  border-radius:30px;
  border:none;
  font-size:15px;
}

.lang{
  text-align:center;
  margin-bottom:10px;
}

.lang button{
  background:#1e3a8a;
  color:#fff;
  border:none;
  padding:6px 14px;
  border-radius:20px;
  margin:0 4px;
  cursor:pointer;
}

.section{
  max-width:1200px;
  margin:40px auto;
  padding:0 15px;
}

.section h2{
  margin-bottom:15px;
  font-size:24px;
}

/* CARDS */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:16px;
}

.card{
  background:var(--card);
  border-radius:16px;
  overflow:hidden;
  text-decoration:none;
  color:#000;
  box-shadow:0 10px 25px rgba(0,0,0,.25);
  transition:.25s;
}

.card:hover{
  transform:translateY(-6px);
}

.card img{
  width:100%;
  height:140px;
  object-fit:contain;
  background:#f8fafc;
  padding:18px;
}

.card .info{
  padding:12px;
  text-align:center;
}

.card .info h3{
  margin:6px 0;
  font-size:16px;
}

.card .info span{
  display:inline-block;
  margin-top:6px;
  padding:6px 14px;
  background:var(--mamey);
  color:#000;
  border-radius:20px;
  font-size:13px;
  font-weight:700;
}

footer{
  text-align:center;
  padding:25px;
  background:#020617;
  font-size:14px;
}
</style>
</head>

<body>

<header>
  <div class="logo">OfferView</div>
  <nav>
    <a href="#">Categorías</a>
    <a href="#">Ofertas</a>
    <a href="#">Favoritos</a>
    <a href="#">Blog</a>
    <a href="#">Acceder</a>
    <a href="#">Registro</a>
  </nav>
</header>

<div class="search-box">
  <input type="text" placeholder="Buscar tiendas, productos o marcas...">
</div>

<div class="lang">
  <button>ES</button>
  <button>EN</button>
</div>

<!-- SECCIONES -->
<div id="content"></div>

<footer>
© 2025 <strong>OfferView</strong> · Directorio Global de Tiendas
</footer>

<script>
const sections = {
  "Top Stores":[
    "amazon.com","alibaba.com","aliexpress.com","ebay.com","walmart.com",
    "temu.com","mercadolibre.com","target.com","costco.com","etsy.com",
    "bestbuy.com","ikea.com","burlington.com","marshalls.com","rossstores.com",
    "miniso.com","made-in-china.com","dollartree.com","homedepot.com","lowes.com"
  ],
  "Gaming Stores":[
    "store.steampowered.com","epicgames.com","playstation.com","xbox.com",
    "nintendo.com","g2a.com","humblebundle.com","greenmangaming.com",
    "ea.com","ubisoft.com"
  ],
  "Technology Stores":[
    "apple.com","samsung.com","lenovo.com","hp.com","dell.com",
    "asus.com","acer.com","xiaomi.com","huawei.com","microsoft.com"
  ],
  "Shoes Stores":[
    "nike.com","adidas.com","puma.com","newbalance.com","reebok.com",
    "skechers.com","converse.com","vans.com","anta.com","lining.com"
  ],
  "Fashion & Lingerie":[
    "shein.com","zara.com","hm.com","uniqlo.com","calvinklein.us",
    "victoriassecret.com","savagex.com","fashionnova.com","ae.com","yesstyle.com"
  ],
  "Travel Stores":[
    "booking.com","expedia.com","airbnb.com","skyscanner.com","kayak.com",
    "agoda.com","trip.com","hotels.com","priceline.com","travelocity.com"
  ],
  "Health & Beauty":[
    "sephora.com","ulta.com","watsons.com","douglas.de","cvs.com",
    "walgreens.com","thebodyshop.com","lush.com","kiehls.com","nyxcosmetics.com"
  ]
};

const container = document.getElementById("content");

for(const section in sections){
  const div = document.createElement("div");
  div.className = "section";
  div.innerHTML = `<h2>${section}</h2><div class="grid"></div>`;
  const grid = div.querySelector(".grid");

  sections[section].forEach(domain=>{
    const name = domain.replace("www.","").split(".")[0];
    grid.innerHTML += `
      <a class="card" href="https://${domain}" target="_blank">
        <img src="https://logo.clearbit.com/${domain}" alt="${name}">
        <div class="info">
          <h3>${name.charAt(0).toUpperCase()+name.slice(1)}</h3>
          <span>Ver ahora</span>
        </div>
      </a>
    `;
  });

  container.appendChild(div);
}
</script>

</body>
</html>
