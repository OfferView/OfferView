<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>OfferView – Tu Guía a las Mejores Ofertas</title>

<meta name="description" content="OfferView es una guía global e independiente que te ayuda a encontrar las mejores ofertas en tiendas online confiables.">
<meta name="keywords" content="ofertas, tiendas online, descuentos, Amazon, Temu, AliExpress, compras">
<meta name="author" content="OfferView">
<meta name="robots" content="index, follow">

<style>
:root{
  --mamey:#F59E0B;
  --bg:#F9FAFB;
  --card:#ffffff;
  --text:#111827;
}
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
}
header{
  text-align:center;
  padding:45px 15px;
  background:#0b1633;
  color:#fff;
}
.logo-offerview{
  width:120px;
  margin-bottom:12px;
}
header h1{
  color:var(--mamey);
  font-size:42px;
  margin:0;
}
.views{margin-top:8px;font-size:14px;}
.search-box{margin:25px auto;max-width:520px;}
.search-box form{display:flex;}
.search-box input{
  flex:1;
  padding:12px;
  border:none;
  border-radius:10px 0 0 10px;
}
.search-box button{
  padding:12px 18px;
  border:none;
  background:var(--mamey);
  font-weight:bold;
  border-radius:0 10px 10px 0;
  cursor:pointer;
}
.controls{margin-top:15px;}
.controls select{
  padding:6px;
  border-radius:6px;
  margin:0 4px;
}
.section-title{
  text-align:center;
  margin:50px 0 22px;
  font-size:26px;
  font-weight:700;
  color:var(--mamey);
}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:20px;
  padding:0 20px 40px;
}
.card{
  background:#fff;
  border-radius:18px;
  padding:26px 15px;
  text-align:center;
  text-decoration:none;
  box-shadow:0 10px 25px rgba(0,0,0,.08);
}
.card span{font-size:18px;font-weight:700}

/* COLORES */
.amazon{color:#FF9900}.temu{color:#FB7701}.aliexpress{color:#FF4747}
.ebay{color:#0064D2}.walmart{color:#0071CE}.target{color:#CC0000}
.costco{color:#E31837}.ikea{color:#0058A3}.mercadolibre{color:#FFE600}
.shopee{color:#EE4D2D}.lazada{color:#1A2B6D}.coupang{color:#4A90E2}
.steam{color:#171A21}.epicgames{color:#000}.playstation{color:#003791}
.xbox{color:#107C10}.nintendo{color:#E60012}.gamestop{color:#E0001B}
.apple{color:#000}.samsung{color:#1428A0}.microsoft{color:#737373}
.nike{color:#111}.adidas{color:#000}.puma{color:#000}
.booking{color:#003580}.expedia{color:#FDBB2D}.airbnb{color:#FF5A5F}

footer{
  background:#eef2f7;
  padding:40px;
  text-align:center;
  font-size:14px;
}
footer a{color:var(--mamey);text-decoration:none}
</style>
</head>

<body>

<header>
  <img src="offerview-logo.png" class="logo-offerview" alt="OfferView">
  <h1>OFFERVIEW</h1>
  <p id="slogan">Tu Guía a las Mejores Ofertas</p>
  <div class="views" id="viewsCounter"></div>

  <div class="search-box">
    <form onsubmit="return OfferViewIA.search(event)">
      <input id="searchInput" placeholder="Buscar tiendas, marcas u ofertas">
      <button>Buscar</button>
    </form>
  </div>

  <div class="controls">
    <select onchange="OfferViewIA.setCountry(this.value)">
      <option value="GLOBAL">🌍 Global</option>
      <option value="RD">🇩🇴 RD</option>
      <option value="US">🇺🇸 US</option>
    </select>
    <select onchange="setLang(this.value)">
      <option value="es">ES</option>
      <option value="en">EN</option>
    </select>
  </div>
</header>

<div id="content"></div>

<footer>
  <p>OfferView es una guía independiente.</p>
  <p>Contacto: <a href="mailto:soporte.offerviews01@gmail.com">soporte.offerviews01@gmail.com</a></p>
  <p><strong>Aviso Legal:</strong> No vendemos productos.</p>
  <p><strong>Privacidad:</strong> No almacenamos datos.</p>
  <p>© 2026 OfferView</p>
</footer>

<script>
let v=localStorage.getItem("offerview_views")||25104;
localStorage.setItem("offerview_views",++v);
viewsCounter.textContent="Views: "+v.toLocaleString();

const OfferViewIA={
country:"GLOBAL",
setCountry(c){this.country=c},
search(e){
e.preventDefault();
window.open("https://www.google.com/search?q="+encodeURIComponent(searchInput.value+" ofertas "+this.country));
},
affiliate(u){
return u.includes("temu")?"https://temu.to/k/gfiiqs13cbu":u;
}
};

function setLang(l){
slogan.textContent=l==="en"?"Your Guide to the Best Deals":"Tu Guía a las Mejores Ofertas";
}

const SECTIONS={
"Top Stores":[
["Amazon","amazon","https://amazon.com"],
["Temu","temu","https://temu.to/k/gfiiqs13cbu"],
["AliExpress","aliexpress","https://aliexpress.com"],
["eBay","ebay","https://ebay.com"],
["Walmart","walmart","https://walmart.com"],
["Target","target","https://target.com"],
["Costco","costco","https://costco.com"],
["IKEA","ikea","https://ikea.com"],
["Mercado Libre","mercadolibre","https://mercadolibre.com"],
["Shopee","shopee","https://shopee.com"],
["Lazada","lazada","https://lazada.com"],
["Coupang","coupang","https://coupang.com"]
],
"Gaming":[
["Steam","steam","https://store.steampowered.com"],
["Epic Games","epicgames","https://store.epicgames.com"],
["PlayStation","playstation","https://store.playstation.com"],
["Xbox","xbox","https://xbox.com/store"],
["Nintendo","nintendo","https://nintendo.com/store"],
["GameStop","gamestop","https://gamestop.com"]
],
"Tecnología":[
["Apple","apple","https://apple.com"],
["Samsung","samsung","https://samsung.com"],
["Microsoft","microsoft","https://microsoft.com"]
],
"Viajes":[
["Booking","booking","https://booking.com"],
["Expedia","expedia","https://expedia.com"],
["Airbnb","airbnb","https://airbnb.com"]
]
};

for(const s in SECTIONS){
  content.innerHTML+=`<h2 class="section-title">${s}</h2><div class="grid">${
    SECTIONS[s].map(t=>`<a class="card" href="${OfferViewIA.affiliate(t[2])}" target="_blank"><span class="${t[1]}">${t[0]}</span></a>`).join("")
  }</div>`;
}
</script>

</body>
</html>
