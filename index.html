<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>OfferView – Tu Guía a las Mejores Ofertas</title>
<meta name="description" content="OfferView es un directorio global de tiendas y marcas del mundo.">
<meta name="author" content="OfferView">

<script async src="https://www.googletagmanager.com/gtag/js?id=G-PDM9GCV149"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'G-PDM9GCV149');
</script>

<style>
:root{
  --mamey:#F59E0B;
  --bg:#F9FAFB;
  --card:#ffffff;
  --text:#111827;
}
body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:var(--bg);
  color:var(--text);
}
header{
  text-align:center;
  padding:40px 15px 25px;
  background:#0b1633;
  color:#fff;
}
header h1{
  color:var(--mamey);
  font-size:40px;
}
.search-box{
  max-width:420px;
  margin:20px auto 0;
}
.search-box input{
  width:100%;
  padding:14px;
  border-radius:14px;
  border:none;
  font-size:16px;
}
.section-title{
  text-align:center;
  margin:45px 0 20px;
  font-size:26px;
  font-weight:700;
  color:var(--mamey);
}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:20px;
  padding:0 20px 40px;
}
.card{
  background:var(--card);
  border-radius:18px;
  padding:20px 15px;
  text-align:center;
  box-shadow:0 10px 25px rgba(0,0,0,0.08);
}
.card img{
  width:64px;
  height:64px;
  object-fit:contain;
  margin-bottom:10px;
}
.card span{
  font-weight:700;
}
footer{
  text-align:center;
  padding:35px;
  background:#eef2f7;
}
</style>
</head>

<body>

<header>
  <h1>OFFERVIEW</h1>
  <p>Tu Guía a las Mejores Ofertas</p>
  <div class="search-box">
    <input id="searchInput" onkeyup="filterStores()" placeholder="Buscar tiendas o marcas...">
  </div>
</header>

<div id="content"></div>

<footer>
© 2025 <strong>OfferView</strong> · Somos una guía independiente de tiendas y marcas
</footer>

<script>
const ICON = n => `https://cdn.jsdelivr.net/npm/simple-icons@v11/icons/${n}.svg`;

const SECTIONS = {
"Top Stores":[
["Amazon","amazon"],["Alibaba","alibaba"],["AliExpress","aliexpress"],["Temu","temu"],
["eBay","ebay"],["Walmart","walmart"],["Costco","costco"],["IKEA","ikea"],
["Target","target"],["Mercado Libre","mercadolibre"],
["Rakuten","rakuten"],["JD","jd"],["Tmall","tmall"],["Taobao","taobao"],
["Miniso","miniso"],["Dollar Tree","dollartree"],["Ross","ross"],
["Marshalls","marshalls"],["Burlington","burlington"],["Wish","wish"]
],

"Gaming Stores":[
["Steam","steam"],["Epic Games","epicgames"],["PlayStation","playstation"],
["Xbox","xbox"],["Nintendo","nintendo"],["GameStop","gamestop"],
["EA","ea"],["Ubisoft","ubisoft"],["Blizzard","blizzard"],["GOG","gog"]
],

"Tecnología Stores":[
["Apple","apple"],["Samsung","samsung"],["Microsoft","microsoft"],
["Dell","dell"],["HP","hp"],["Lenovo","lenovo"],
["Asus","asus"],["Acer","acer"],["Xiaomi","xiaomi"],["Newegg","newegg"]
],

"Calzados Stores":[
["Nike","nike"],["Adidas","adidas"],["Puma","puma"],
["New Balance","newbalance"],["Reebok","reebok"],
["Skechers","skechers"],["Converse","converse"],
["Vans","vans"],["Crocs","crocs"],["Under Armour","underarmour"]
],

"Moda & Lencería Stores":[
["Zara","zara"],["H&M","hm"],["Uniqlo","uniqlo"],
["Shein","shein"],["Fashion Nova","fashionnova"],
["Victoria’s Secret","victoriassecret"],["Aerie","aerie"],
["Calvin Klein","calvinklein"],["Savage X Fenty","savagexfenty"],["Oysho","oysho"]
],

"Juguetería Stores":[
["LEGO","lego"],["Mattel","mattel"],["Hasbro","hasbro"],
["Funko","funko"],["Toys R Us","toysrus"],
["Fisher-Price","fisherprice"],["Bandai","bandai"],
["Playmobil","playmobil"],["Disney Store","disney"],["Nerf","nerf"]
]
};

const content=document.getElementById("content");

for(const section in SECTIONS){
  const h=document.createElement("h2");
  h.className="section-title";
  h.textContent=section;
  content.appendChild(h);

  const grid=document.createElement("div");
  grid.className="grid";

  SECTIONS[section].forEach(s=>{
    grid.innerHTML+=`
      <div class="card">
        <img src="${ICON(s[1])}">
        <span>${s[0]}</span>
      </div>`;
  });

  content.appendChild(grid);
}

function filterStores(){
  const v=document.getElementById("searchInput").value.toLowerCase();
  document.querySelectorAll(".card").forEach(c=>{
    c.style.display=c.textContent.toLowerCase().includes(v)?"block":"none";
  });
}
</script>

</body>
</html>
