<style>
:root{
  --mamey:#F59E0B;
  --blue:#2563EB;
  --bg:#F9FAFB;
  --card:#ffffff;
  --text:#111827;
}

body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:var(--bg);
  color:var(--text);
}

header{
  text-align:center;
  padding:40px 15px;
  background:#0b1633;
  color:#fff;
}

header h1{
  color:var(--mamey);
  font-size:38px;
  margin-bottom:5px;
}

header p{
  margin:0;
  font-size:16px;
}

.lang-switch{
  margin-top:15px;
}

.lang-switch button{
  background:#1f2937;
  color:#fff;
  border:none;
  padding:6px 12px;
  border-radius:8px;
  margin:0 4px;
  cursor:pointer;
}

.section-title{
  text-align:center;
  margin:40px 0 20px;
  font-size:26px;
  font-weight:700;
  color:var(--mamey);
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:18px;
  padding:0 20px 40px;
}

.card{
  background:var(--card);
  border-radius:18px;
  padding:20px 15px;
  text-align:center;
  text-decoration:none;
  color:var(--blue);
  box-shadow:0 10px 25px rgba(0,0,0,0.08);
  transition:.25s;
}

.card:hover{
  transform:translateY(-6px);
}

.card img{
  width:80px;
  height:80px;
  object-fit:contain;
  margin-bottom:12px;
}

footer{
  text-align:center;
  padding:35px 15px;
  background:#eef2f7;
  font-size:14px;
}
</style>
</head>

  <div class="lang-switch">

</header>

// ================= RENDER =================
const content=document.getElementById("content");
for(const section in SECTIONS){
  const h=document.createElement("h2");
  h.className="section-title";
  h.textContent=section;
  content.appendChild(h);

  const grid=document.createElement("div");
  grid.className="grid";

  SECTIONS[section].forEach(s=>{
    const a=document.createElement("a");
    a.className="card";
    a.href=s[1];
    a.target="_blank";
    a.innerHTML=`
      <img src="${s[2]}" alt="${s[0]}">
      <div>${s[0]}</div>`;
    grid.appendChild(a);
  });

  content.appendChild(grid);
}

// ================= ESLOGAN =================
const LANG={es:"Tu Guía a Las Mejores Ofertas",en:"Your Guide to the Best Deals"};
