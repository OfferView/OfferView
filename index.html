<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>OfferView – Tu Guía a las Mejores Ofertas</title>
<meta name="description" content="OfferView es una guía global que reúne tiendas, marcas y plataformas populares para ayudarte a descubrir las mejores ofertas del mundo.">
<meta name="author" content="OfferView">

<!-- Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-PDM9GCV149"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'G-PDM9GCV149');
</script>

<style>
:root{
  --mamey:#F59E0B;
  --blue:#2563EB;
  --bg:#F9FAFB;
  --card:#ffffff;
  --text:#111827;
}

body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:var(--bg);
  color:var(--text);
}

header{
  text-align:center;
  padding:40px 15px;
  background:#0b1633;
  color:#fff;
}

header h1{
  color:var(--mamey);
  font-size:42px;
  margin-bottom:8px;
}

header p{
  margin:0;
  font-size:16px;
}

.lang-switch{
  margin-top:15px;
}

.lang-switch button{
  background:#1f2937;
  color:#fff;
  border:none;
  padding:6px 12px;
  border-radius:8px;
  margin:0 4px;
  cursor:pointer;
}

/* BUSCADOR GOOGLE */
.search-box{
  margin:25px auto 0;
  max-width:520px;
  display:flex;
}

.search-box input{
  flex:1;
  padding:14px;
  border-radius:12px 0 0 12px;
  border:none;
  font-size:15px;
  outline:none;
}

.search-box button{
  padding:14px 18px;
  border:none;
  border-radius:0 12px 12px 0;
  background:var(--mamey);
  font-weight:bold;
  cursor:pointer;
}

/* SECCIONES */
.section-title{
  text-align:center;
  margin:50px 0 22px;
  font-size:26px;
  font-weight:700;
  color:var(--mamey);
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:22px;
  padding:0 20px 40px;
}

.card{
  background:var(--card);
  border-radius:18px;
  padding:20px 15px;
  text-align:center;
  text-decoration:none;
  color:var(--text);
  box-shadow:0 10px 25px rgba(0,0,0,0.08);
  transition:.25s;
}

.card:hover{
  transform:translateY(-6px);
}

.card img{
  width:72px;
  height:72px;
  object-fit:contain;
  margin-bottom:12px;
}

.card span{
  display:block;
  font-weight:700;
}

/* FOOTER */
footer{
  text-align:center;
  padding:35px 15px;
  background:#eef2f7;
  font-size:14px;
}
</style>
</head>

<body>

<header>
  <h1>OFFERVIEW</h1>
  <p id="slogan">Tu Guía a las Mejores Ofertas</p>

  <div class="lang-switch">
    <button onclick="setLang('es')">ES</button>
    <button onclick="setLang('en')">EN</button>
  </div>

  <!-- BUSCADOR REAL GOOGLE -->
  <form class="search-box" action="https://www.google.com/search" method="get" target="_blank">
    <input type="text" name="q" placeholder="Buscar cualquier tienda o marca en Internet..." required>
    <button type="submit">Buscar</button>
  </form>
</header>

<div id="content"></div>

<footer>
© 2025 <strong>OfferView</strong> · Guía Global de Tiendas · No afiliado oficialmente a las marcas listadas
</footer>

<script>
const ICON = name => `https://cdn.jsdelivr.net/npm/simple-icons@v11/icons/${name}.svg`;

const SECTIONS = {

"Top Stores":[
["Amazon","amazon","https://www.amazon.com"],
["Alibaba","alibaba","https://www.alibaba.com"],
["AliExpress","aliexpress","https://www.aliexpress.com"],
["Temu","temu","https://www.temu.com"],
["eBay","ebay","https://www.ebay.com"],
["Walmart","walmart","https://www.walmart.com"],
["Costco","costco","https://www.costco.com"],
["IKEA","ikea","https://www.ikea.com"],
["Burlington","burlington","https://www.burlington.com"],
["Marshalls","marshalls","https://www.marshalls.com"],
["Ross","ross","https://www.rossstores.com"],
["Miniso","miniso","https://www.miniso.com"],
["Dollar Tree","dollartree","https://www.dollartree.com"],
["Made in China","madeinchina","https://www.made-in-china.com"],
["JD","jd","https://www.jd.com"],
["Taobao","taobao","https://www.taobao.com"],
["Tmall","tmall","https://www.tmall.com"],
["Rakuten","rakuten","https://www.rakuten.com"],
["Mercado Libre","mercadolibre","https://www.mercadolibre.com"],
["Target","target","https://www.target.com"]
],

"Gaming Stores":[
["Steam","steam","https://store.steampowered.com"],
["Epic Games","epicgames","https://store.epicgames.com"],
["PlayStation","playstation","https://store.playstation.com"],
["Xbox","xbox","https://www.xbox.com/store"],
["Nintendo","nintendo","https://www.nintendo.com/store"],
["GameStop","gamestop","https://www.gamestop.com"],
["Ubisoft","ubisoft","https://store.ubisoft.com"],
["EA","ea","https://www.ea.com"],
["Blizzard","blizzard","https://www.blizzard.com"],
["GOG","gog","https://www.gog.com"]
],

"Tecnología Stores":[
["Apple","apple","https://www.apple.com"],
["Samsung","samsung","https://www.samsung.com"],
["Microsoft","microsoft","https://www.microsoft.com"],
["Lenovo","lenovo","https://www.lenovo.com"],
["Dell","dell","https://www.dell.com"],
["HP","hp","https://www.hp.com"],
["Asus","asus","https://www.asus.com"],
["Acer","acer","https://www.acer.com"],
["Xiaomi","xiaomi","https://www.mi.com"],
["Newegg","newegg","https://www.newegg.com"]
],

"Calzados Stores":[
["Nike","nike","https://www.nike.com"],
["Adidas","adidas","https://www.adidas.com"],
["Puma","puma","https://www.puma.com"],
["New Balance","newbalance","https://www.newbalance.com"],
["Reebok","reebok","https://www.reebok.com"],
["Skechers","skechers","https://www.skechers.com"],
["Converse","converse","https://www.converse.com"],
["Vans","vans","https://www.vans.com"],
["Crocs","crocs","https://www.crocs.com"],
["Under Armour","underarmour","https://www.underarmour.com"]
],

"Moda & Lencería Stores":[
["Zara","zara","https://www.zara.com"],
["H&M","hm","https://www.hm.com"],
["Uniqlo","uniqlo","https://www.uniqlo.com"],
["Fashion Nova","fashionnova","https://www.fashionnova.com"],
["Victoria’s Secret","victoriassecret","https://www.victoriassecret.com"],
["Aerie","aerie","https://www.ae.com"],
["Calvin Klein","calvinklein","https://www.calvinklein.com"],
["Savage X Fenty","savagexfenty","https://www.savagex.com"],
["Shein","shein","https://www.shein.com"],
["Oysho","oysho","https://www.oysho.com"]
],

"Hoteles y Vuelos Stores":[
["Booking","booking","https://www.booking.com"],
["Expedia","expedia","https://www.expedia.com"],
["Airbnb","airbnb","https://www.airbnb.com"],
["Kayak","kayak","https://www.kayak.com"],
["Skyscanner","skyscanner","https://www.skyscanner.com"],
["Agoda","agoda","https://www.agoda.com"],
["Trip.com","tripdotcom","https://www.trip.com"],
["Hotels.com","hotelsdotcom","https://www.hotels.com"],
["Priceline","priceline","https://www.priceline.com"],
["Travelocity","travelocity","https://www.travelocity.com"]
]

};

const content=document.getElementById("content");

for(const section in SECTIONS){
  const h=document.createElement("h2");
  h.className="section-title";
  h.textContent=section;
  content.appendChild(h);

  const grid=document.createElement("div");
  grid.className="grid";

  SECTIONS[section].forEach(s=>{
    const a=document.createElement("a");
    a.className="card";
    a.href=s[2];
    a.target="_blank";
    a.innerHTML=`
      <img src="${ICON(s[1])}" alt="${s[0]} logo">
      <span>${s[0]}</span>`;
    grid.appendChild(a);
  });

  content.appendChild(grid);
}

const LANG={
  es:"Tu Guía a las Mejores Ofertas",
  en:"Your Guide to the Best Deals"
};

function setLang(l){
  document.getElementById("slogan").textContent=LANG[l];
}
</script>

</body>
</html>
