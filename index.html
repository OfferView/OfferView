<style>
:root{
--mamey:#F59E0B;--bg:#F9FAFB;--card:#fff;--text:#111827;
}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
header{text-align:center;padding:45px 15px;background:#0b1633;color:#fff}

.views{font-size:14px}

.search-box form{display:flex}
.search-box input{flex:1;padding:12px;border:none;border-radius:10px 0 0 10px}
.search-box button{padding:12px 18px;border:none;background:var(--mamey);font-weight:bold;border-radius:0 10px 10px 0}
.controls select{padding:6px;border-radius:6px;margin:4px}

.section-title{text-align:center;margin:50px 0 22px;font-size:26px;font-weight:700;color:var(--mamey)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:20px;padding:0 20px 40px}
.card{background:#fff;border-radius:18px;padding:26px 15px;text-align:center;text-decoration:none;box-shadow:0 10px 25px rgba(0,0,0,.08);transition:.25s}
.card:hover{transform:translateY(-6px)}
.card span{font-size:18px;font-weight:700}

/* Colores tiendas */
.amazon{color:#FF9900}.temu{color:#FB7701}.aliexpress{color:#FF4747}
.ebay{color:#0064D2}.walmart{color:#0071CE}.target{color:#CC0000}
.costco{color:#E31837}.bestbuy{color:#003B64}.newegg{color:#F28C28}
.etsy{color:#F1641E}.shein{color:#111}.shopee{color:#EE4D2D}
.miniso{color:#E50012}.ross{color:#1B75BC}.marshalls{color:#00539B}
.burlington{color:#00539B}.ikea{color:#0058A3}.rakuten{color:#BF0000}
.coppel{color:#005AA9}.falabella{color:#0072CE}
.magalu{color:#0086FF}.americanas{color:#E60014}.linio{color:#00AEEF}.mercadolibre{color:#FFE600}
.alibaba{color:#FF6600}

footer{background:#eef2f7;padding:40px;text-align:center;font-size:14px}
footer a{color:var(--mamey);text-decoration:none}

/* Publicidad */
#adCarousel{display:flex;gap:20px;overflow-x:auto;padding:20px}
.ad-card{min-width:260px;background:#0b1633;color:#fff;border-radius:18px;padding:14px}
.ad-card img{width:100%;border-radius:12px}
#adBtn{display:block;margin:0 auto 40px;padding:14px 28px;background:var(--mamey);border:none;border-radius:14px;font-weight:bold}

/* Modal */
#offerModal,#adModal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:999;align-items:center;justify-content:center}
#offerModal form,#adModal div{background:#fff;padding:30px;border-radius:18px;max-width:420px;width:90%}
#offerModal h2,#adModal h3{margin-top:0;color:#F59E0B}
#offerModal input,#offerModal textarea,#adModal input,#adModal textarea{width:100%;padding:12px;margin:8px 0}
#offerModal button,#adModal button{width:100%;padding:14px;margin-top:10px;border:none;border-radius:12px;font-weight:bold}
#offerModal button[type=button]{background:#eee}
#offerModal button[type=submit]{background:#F59E0B}

<textarea id="descripcion" required placeholder="Descripción"></textarea>
<input id="link" required placeholder="Link de la oferta">

db.collection("visitas").doc("contador").get().then(doc=>{
  let v = doc.exists ? doc.data().count : 0;
  v++;
  viewsCounterEl.textContent = "Views: " + v.toLocaleString();

// Funciones principales

language:"ES",
setCountry(c){this.country=c},
setLanguage(l){
this.language=l;
document.getElementById("offersTitle").textContent=
(l==="ES")?"Ofertas Para Ti":(l==="PT")?"Ofertas Para Você":"Deals For You";
},
search(e){
e.preventDefault();
window.open("https://www.google.com/search?q="+encodeURIComponent(document.getElementById("searchInput").value+" ofertas "+this.country),"_blank");
},
affiliate(u){
if(u.includes("temu")) return "https://temu.to/k/gfiiqs13cbu";
return u;
}
};

// Publicidad
function publishAd() {
  const name = document.getElementById("adName").value;
  const text = document.getElementById("adText").value;
  const file = document.getElementById("adImg").files[0];

  if (!name || !text || !file) {
    alert("Completa todos los campos");
    return;
  }

  const storageRef = storage.ref("publicidad/" + Date.now() + "_" + file.name);

  storageRef.put(file).then(snapshot => {
    snapshot.ref.getDownloadURL().then(url => {

      db.collection("publicidad").add({
        nombre: name,
        texto: text,
        imagen: url,
        fecha: firebase.firestore.FieldValue.serverTimestamp()
      }).then(() => {
        document.getElementById("adModal").style.display = "none";
        loadAds();
      });

    });
  });
}

// Registro & Publicar Ofertas
function openOfferModal(){document.getElementById("offerModal").style.display="flex";}
function closeOfferModal(){document.getElementById("offerModal").style.display="none";}
function registrarOferta(e){
e.preventDefault();
db.collection("ofertas").add({
titulo: document.getElementById("titulo").value,
descripcion: document.getElementById("descripcion").value,
link: document.getElementById("link").value,
fecha: new Date()
  }).then(()=>{
  closeOfferModal();
});
}

// ofertas globales
function loadAds() {
  const adCarousel = document.getElementById("adCarousel");
  adCarousel.innerHTML = "";

  db.collection("publicidad")
    .orderBy("fecha", "desc")
    .onSnapshot(snapshot => {
      adCarousel.innerHTML = "";

      snapshot.forEach(doc => {
        const ad = doc.data();
        const id = doc.id;

        adCarousel.innerHTML += `
          <div class="ad-card">
            <img src="${ad.imagen}" loading="lazy">
            <h4>${ad.nombre}</h4>
            <p>${ad.texto}</p>
          </div>
        `;
      });
    });
}
loadAds();

function loadOffers(){
  const adCarousel = document.getElementById("adCarousel");

  db.collection("ofertas")
    .orderBy("fecha","desc")
    .onSnapshot(snapshot=>{
      snapshot.forEach(doc=>{
        const o = doc.data();
        adCarousel.innerHTML += `
          <div class="ad-card">
            <h4>${o.titulo}</h4>
            <p>${o.descripcion}</p>
            <a href="${o.link}" target="_blank" style="color:#F59E0B">Ver oferta</a>

        `;
      });
    });
}
