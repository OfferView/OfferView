function publicarImagen(e){
e.preventDefault();

if(!auth.currentUser){
alert("Debes iniciar sesión para publicar");
return;
}

const file = document.getElementById("imagenOferta").files[0];
const linkOferta = document.getElementById("linkOferta").value;

if(!file){
alert("Debes subir una imagen");
return;
}

const formData = new FormData();
formData.append("file", file);
formData.append("upload_preset", "ofertas_publicas");

fetch("https://api.cloudinary.com/v1_1/dveqauvqh/image/upload", {
method: "POST",
body: formData
})
.then(res => res.json())
.then(data => {

if(!data.secure_url){      
  console.error(data);      
  alert("Cloudinary rechazó la imagen");      
  return;      
}      
  
return db.collection("publicidad").add({      
  imagen: data.secure_url,      
  link: linkOferta || null,      
  uid: auth.currentUser.uid, // 🔥 FUNDAMENTAL      
  fecha: firebase.firestore.FieldValue.serverTimestamp()      
});

})
.then(()=>{
closeOfferModal();
alert("Imagen publicada correctamente ✅");

// limpiar campos      
document.getElementById("imagenOferta").value = "";      
document.getElementById("linkOferta").value = "";

})
.catch(err=>{
console.error(err);
alert("Error al subir la imagen");
});

return false;
}

/* ================= CARRUSEL RR OPTIMIZADO ================= */
function loadAds(){

db.collection("publicidad")
.orderBy("fecha","desc")
.onSnapshot(snapshot => {

const adCarousel = document.getElementById("adCarousel");      
  adCarousel.innerHTML = "";      
  
  snapshot.forEach(doc => {      
  
    const data = doc.data();      
    const postId = doc.id;      
  
    const card = document.createElement("div");      
    card.className = "ad-card";      
  
    let img = document.createElement("img");      
    img.src = data.imagen;      
    img.loading = "lazy";      
  
    if(data.link){      
      const link = document.createElement("a");      
      link.href = data.link;      
      link.target = "_blank";      
      link.appendChild(img);      
      card.appendChild(link);      
    } else {      
      card.appendChild(img);      
    }      
  
    if(auth.currentUser && auth.currentUser.uid === data.uid){      
      const deleteBtn = document.createElement("button");      
      deleteBtn.className = "delete-btn";      
      deleteBtn.innerHTML = "✖";      
      deleteBtn.onclick = () => eliminarAd(postId);      
      card.appendChild(deleteBtn);      
    }      
  
    const likeBox = document.createElement("div");      
    likeBox.className = "like-box";      
    likeBox.innerHTML = `❤️ <span id="likes-${postId}">0</span>`;      
    likeBox.onclick = () => toggleLike(postId);      
  
    card.appendChild(likeBox);      
    adCarousel.appendChild(card);      
  
    // Contador simple (sin crear múltiples listeners pesados)      
    db.collection("likes")      
      .where("postId","==",postId)      
      .get()      
      .then(likesSnapshot=>{      
        const likesEl = document.getElementById("likes-"+postId);      
        if(likesEl){      
          likesEl.textContent = likesSnapshot.size;      
        }      
      });      
  
  });      
  
});

}

loadAds();

/* ================= ELIMINAR PUBLICIDAD ================= */
function eliminarAd(id){
if(!confirm("¿Eliminar esta publicación?")) return;

db.collection("publicidad")
.doc(id)
.delete()
.then(() => {
console.log("Publicidad eliminada correctamente");
})
.catch(error => {
console.error("Error al eliminar:", error);
alert("No se pudo eliminar la publicidad");
});
}

/* ================= LIKE SISTEMA RR ================= */
function toggleLike(postId){

if(!auth.currentUser){
alert("Debes iniciar sesión para dar like");
return;
}

const uid = auth.currentUser.uid;

const likeRef = db.collection("likes")
.where("postId","==",postId)
.where("uid","==",uid);

likeRef.get().then(snapshot=>{
if(snapshot.empty){
db.collection("likes").add({
postId: postId,
uid: uid,
fecha: firebase.firestore.FieldValue.serverTimestamp()
});
}else{
snapshot.forEach(doc=>{
doc.ref.delete();
});
}
});

}

/* ================= RENDER STORE CARDS ================= */

function renderStoreCards(){

  const carousel = document.getElementById("storesCarousel");
  carousel.innerHTML = "";

  Object.keys(SECTIONS).forEach(section => {

    const stores = SECTIONS[section];

    // 🔥 CREAR TARJETA PRIMERO
    const card = document.createElement("div");
    card.className = "store-card";

    // 🎨 Color por sección
    if(section === "Top Stores") card.classList.add("topstores");
    if(section === "Gaming Stores") card.classList.add("gaming");
    if(section === "Tecnología Stores") card.classList.add("tecnologia");
    if(section === "Moda y Lencería Stores") card.classList.add("moda");
    if(section === "Calzados Stores") card.classList.add("calzados");
    if(section === "Hoteles y Vuelos Stores") card.classList.add("hoteles");

    // 🏷 Título
    const title = document.createElement("h3");
    title.textContent = section;
    card.appendChild(title);

    // 🔹 Primeras 5 tiendas
    const list = document.createElement("div");
    list.className = "store-list";

    const firstFive = stores.slice(0,5);
    const rest = stores.slice(5);

    firstFive.forEach(store=>{
      list.innerHTML += `
        <span>
          <a href="${store[2]}" target="_blank">
            ${store[0]}
          </a>
        </span>
      `;
    });

    card.appendChild(list);

    // 🔥 Tiendas ocultas
    if(rest.length > 0){

      const more = document.createElement("div");
      more.className = "store-list";
      more.style.display = "none";

      rest.forEach(store=>{
        more.innerHTML += `
          <span>
            <a href="${store[2]}" target="_blank">
              ${store[0]}
            </a>
          </span>
        `;
      });

      card.appendChild(more);

      // ➕ Botón expandir
      const btn = document.createElement("button");
      btn.className = "expand-btn";
      btn.textContent = "+";

      btn.onclick = function(){

        if(more.style.display === "none"){
          more.style.display = "block";
          btn.textContent = "−";
        }else{
          more.style.display = "none";
          btn.textContent = "+";
        }

      };

      card.appendChild(btn);
    }

    carousel.appendChild(card);

  });

}

  
/* ========= AUTO CARRUSEL STORES ========= */

let storeInterval;
const storeSpeed = 1;

function startStoreCarousel(){
  const carousel = document.getElementById("storesCarousel");

  storeInterval = setInterval(()=>{
    carousel.scrollLeft += storeSpeed;

    if(carousel.scrollLeft >= carousel.scrollWidth / 2){
      carousel.scrollLeft = 0;
    }

  },20);
}

function stopStoreCarousel(){
  clearInterval(storeInterval);
}

window.addEventListener("load", function(){

  renderStoreCards();
  startStoreCarousel();

  const carousel = document.getElementById("storesCarousel");

  carousel.addEventListener("mouseenter", stopStoreCarousel);
  carousel.addEventListener("mouseleave", startStoreCarousel);

});

function guardarPlataforma(){

if(!auth.currentUser){
alert("Debes iniciar sesión");
return;
}

const nombre = document.getElementById("nombrePlataforma").value;
const link = document.getElementById("linkPlataforma").value;

if(!nombre || !link){
alert("Completa todos los campos");
return;
}

db.collection("plataformas").add({
uid: auth.currentUser.uid,
nombre: nombre,
link: link,
fecha: firebase.firestore.FieldValue.serverTimestamp()
})
.then(()=>{
document.getElementById("nombrePlataforma").value="";
document.getElementById("linkPlataforma").value="";
cargarPlataformas();
});
}

function cargarPlataformas(){

if(!auth.currentUser) return;

const lista = document.getElementById("listaPlataformas");
lista.innerHTML="";

db.collection("plataformas")
.where("uid","==",auth.currentUser.uid)
.orderBy("fecha","desc")
.onSnapshot(snapshot=>{

lista.innerHTML="";      
  
  snapshot.forEach(doc=>{      
    const data = doc.data();      
  
    lista.innerHTML += `      
      <div style="margin-bottom:8px;">      
        <a href="${data.link}" target="_blank">${data.nombre}</a>      
        <button onclick="eliminarPlataforma('${doc.id}')" style="margin-left:8px;">✖</button>      
      </div>      
    `;      
  });      
  
});

}

function eliminarPlataforma(id){
db.collection("plataformas").doc(id).delete();
}

/* ================= MENU HAMBURGUESA ================= */

function toggleMenu() {
  const menu = document.getElementById("sideMenu");
  const overlay = document.getElementById("overlay");

  if (menu.classList.contains("active")) {
    // Cerrar menú
    menu.classList.remove("active");
    overlay.style.display = "none";
  } else {
    // Abrir menú
    menu.classList.add("active");
    overlay.style.display = "block";
  }
}

/* Cerrar menú manualmente */
function closeMenu() {
  document.getElementById("sideMenu").classList.remove("active");
  document.getElementById("overlay").style.display = "none";
}

/* Cerrar menú al tocar fondo oscuro */
document.getElementById("overlay").addEventListener("click", closeMenu);

/* Logout */
function logoutUser() {
  auth.signOut().then(() => {
    closeMenu();
  });
}
