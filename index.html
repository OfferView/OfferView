<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OfferView – Tu Guía a Las Mejores Ofertas</title>

<meta name="description" content="OfferView es un directorio global de tiendas online. Tu guía a las mejores ofertas del mundo.">
<meta name="author" content="OfferView">

<!-- Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-PDM9GCV149"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'G-PDM9GCV149');
</script>

<style>
:root{
  --mamey:#F59E0B;
  --blue:#2563EB;
  --bg:#F9FAFB;
  --card:#ffffff;
  --text:#111827;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:var(--bg);
  color:var(--text);
}

/* HEADER */
header{
  text-align:center;
  padding:40px 15px;
  background:#0b1633;
  color:#fff;
}

header h1{
  color:var(--mamey);
  font-size:40px;
  margin:0 0 8px;
  letter-spacing:1px;
}

header p{
  margin:0;
  font-size:17px;
}

.lang-switch{
  margin-top:15px;
}

.lang-switch button{
  background:#1f2937;
  color:#fff;
  border:none;
  padding:6px 12px;
  border-radius:8px;
  margin:0 4px;
  cursor:pointer;
}

/* SECTIONS */
.section-title{
  text-align:center;
  margin:45px 0 20px;
  font-size:26px;
  font-weight:700;
  color:var(--mamey);
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:18px;
  padding:0 20px 40px;
}

.card{
  background:var(--card);
  border-radius:18px;
  padding:22px 15px;
  text-align:center;
  text-decoration:none;
  color:var(--blue);
  box-shadow:0 10px 25px rgba(0,0,0,0.08);
  transition:.25s;
}

.card:hover{
  transform:translateY(-6px);
}

.card img{
  width:80px;
  height:80px;
  object-fit:contain;
  margin-bottom:12px;
}

/* FOOTER */
footer{
  text-align:center;
  padding:35px 15px;
  background:#eef2f7;
  font-size:14px;
}

footer a{
  color:#2563eb;
  text-decoration:none;
  margin:0 8px;
}

/* COOKIE */
#cookie{
  position:fixed;
  bottom:0;
  left:0;
  width:100%;
  background:#111827;
  color:#fff;
  padding:14px;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:15px;
  z-index:999;
}

#cookie button{
  background:var(--mamey);
  border:none;
  padding:6px 14px;
  border-radius:6px;
  cursor:pointer;
}
</style>
</head>

<body>

<header>
  <h1>OFFERVIEW</h1>
  <p id="slogan">Tu Guía a Las Mejores Ofertas</p>
  <div class="lang-switch">
    <button onclick="setLang('es')">ES</button>
    <button onclick="setLang('en')">EN</button>
  </div>
</header>

<div id="content"></div>

<footer>
© 2025 <strong>OfferView</strong> · Directorio Global de Tiendas  
<br><br>
<a href="#">Privacidad</a> | <a href="#">Cookies</a> | <a href="mailto:info@offerview.com">Contacto</a>
</footer>

<div id="cookie">
Este sitio usa cookies para mejorar tu experiencia.
<button onclick="acceptCookies()">Aceptar</button>
</div>

<script>
const SECTIONS = {

"Top Stores":[
["Amazon","amazon.com"],["Alibaba","alibaba.com"],["AliExpress","aliexpress.com"],
["eBay","ebay.com"],["Walmart","walmart.com"],["Target","target.com"],
["Best Buy","bestbuy.com"],["Costco","costco.com"],["Burlington","burlington.com"],
["Marshalls","marshalls.com"],["Ross","rossstores.com"],["Miniso","miniso.com"],
["Dollar Tree","dollartree.com"],["Made in China","made-in-china.com"],
["Temu","temu.com"],["Shein","shein.com"],["Wish","wish.com"],
["JD","jd.com"],["Rakuten","rakuten.com"],["Mercado Libre","mercadolibre.com"]
],

"Gaming Stores":[
["Steam","steampowered.com"],["Epic Games","epicgames.com"],
["PlayStation","playstation.com"],["Xbox","xbox.com"],
["Nintendo","nintendo.com"],["GameStop","gamestop.com"],
["Ubisoft","ubisoft.com"],["EA","ea.com"],
["Blizzard","blizzard.com"],["GOG","gog.com"]
],

"Moda Stores":[
["Zara","zara.com"],["H&M","hm.com"],["Forever 21","forever21.com"],
["Uniqlo","uniqlo.com"],["Pull&Bear","pullandbear.com"],
["Bershka","bershka.com"],["Stradivarius","stradivarius.com"],
["Fashion Nova","fashionnova.com"],["Gap","gap.com"],["Old Navy","oldnavy.com"]
],

"Calzados Stores":[
["Nike","nike.com"],["Adidas","adidas.com"],["Puma","puma.com"],
["Foot Locker","footlocker.com"],["New Balance","newbalance.com"],
["Skechers","skechers.com"],["Reebok","reebok.com"],
["Converse","converse.com"],["Vans","vans.com"],["Crocs","crocs.com"]
],

"Lencería Stores":[
["Victoria’s Secret","victoriassecret.com"],["Aerie","aerie.com"],
["Calvin Klein","calvinklein.com"],["Savage X Fenty","savagex.com"],
["La Senza","lasenza.com"],["Intimissimi","intimissimi.com"],
["Oysho","oysho.com"],["ThirdLove","thirdlove.com"],
["Skims","skims.com"],["Adore Me","adoreme.com"]
],

"Tecnología Stores":[
["Newegg","newegg.com"],["B&H","bhphotovideo.com"],
["Lenovo","lenovo.com"],["Dell","dell.com"],
["HP","hp.com"],["Xiaomi","mi.com"],
["Asus","asus.com"],["Acer","acer.com"],
["Microsoft","microsoft.com"],["Samsung","samsung.com"]
],

"Salud y Belleza Stores":[
["Sephora","sephora.com"],["Ulta Beauty","ulta.com"],
["Sally Beauty","sallybeauty.com"],["The Body Shop","thebodyshop.com"],
["Bath & Body Works","bathandbodyworks.com"],["L'Oréal","loreal.com"],
["Maybelline","maybelline.com"],["Clinique","clinique.com"],
["Estée Lauder","esteelauder.com"],["NYX","nyxcosmetics.com"]
],

"Niños y Juguetería Stores":[
["Toys R Us","toysrus.com"],["Lego","lego.com"],
["Mattel","mattel.com"],["Hasbro","hasbro.com"],
["Disney Store","shopdisney.com"],["Fisher-Price","fisher-price.com"],
["Babylist","babylist.com"],["Carter’s","carters.com"],
["OshKosh","oshkosh.com"],["Kidpik","kidpik.com"]
],

"Hoteles y Vuelos Stores":[
["Booking","booking.com"],["Expedia","expedia.com"],
["Airbnb","airbnb.com"],["Kayak","kayak.com"],
["Skyscanner","skyscanner.com"],["Priceline","priceline.com"],
["Agoda","agoda.com"],["Trip.com","trip.com"],
["Hotels.com","hotels.com"],["Travelocity","travelocity.com"]
]

};

const content=document.getElementById("content");

for(const section in SECTIONS){
  const h=document.createElement("h2");
  h.className="section-title";
  h.textContent=section;
  content.appendChild(h);

  const grid=document.createElement("div");
  grid.className="grid";

  SECTIONS[section].forEach(s=>{
    const a=document.createElement("a");
    a.className="card";
    a.href="https://"+s[1];
    a.target="_blank";
    a.rel="noopener";
    a.innerHTML=`
      <img src="https://logo.clearbit.com/${s[1]}" alt="${s[0]}">
      <div>${s[0]}</div>`;
    grid.appendChild(a);
  });

  content.appendChild(grid);
}

/* Idiomas */
const LANG={
es:"Tu Guía a Las Mejores Ofertas",
en:"Your Guide to the Best Deals"
};

function setLang(l){
  document.getElementById("slogan").textContent=LANG[l];
}

/* Cookies */
function acceptCookies(){
  localStorage.setItem("cookiesAccepted","yes");
  document.getElementById("cookie").style.display="none";
}

if(localStorage.getItem("cookiesAccepted")==="yes"){
  document.getElementById("cookie").style.display="none";
}
</script>

</body>
</html>
