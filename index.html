<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>OfferView – Tu Guía a Las Mejores Ofertas</title>

<meta name="description" content="OfferView es un directorio global que reúne las tiendas más visitadas del mundo en un solo lugar.">
<meta name="author" content="OfferView">

<!-- Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-PDM9GCV149"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'G-PDM9GCV149');
</script>

<style>
:root{
  --mamey:#F59E0B;
  --blue:#2563EB;
  --bg:#F9FAFB;
  --card:#ffffff;
  --text:#111827;
}

body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:var(--bg);
  color:var(--text);
}

header{
  text-align:center;
  padding:40px 15px;
  background:#0b1633;
  color:#fff;
}

header h1{
  color:var(--mamey);
  font-size:40px;
  margin-bottom:8px;
}

header p{
  margin:0;
  font-size:16px;
}

.lang-switch{
  margin-top:15px;
}

.lang-switch button{
  background:#1f2937;
  color:#fff;
  border:none;
  padding:6px 12px;
  border-radius:8px;
  margin:0 4px;
  cursor:pointer;
}

.section-title{
  text-align:center;
  margin:40px 0 20px;
  font-size:26px;
  font-weight:700;
  color:var(--mamey);
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:18px;
  padding:0 20px 40px;
}

.card{
  background:var(--card);
  border-radius:16px;
  padding:18px;
  text-align:center;
  text-decoration:none;
  color:var(--blue);
  font-weight:700;
  box-shadow:0 8px 22px rgba(0,0,0,0.08);
  transition:.25s;
}

.card:hover{
  transform:translateY(-4px);
  background:var(--mamey);
  color:#fff;
}

footer{
  text-align:center;
  padding:35px 15px;
  background:#eef2f7;
  font-size:14px;
}

footer a{
  color:var(--blue);
  text-decoration:none;
  margin:0 10px;
}
</style>
</head>

<body>

<header>
  <h1>OFFERVIEW</h1>
  <p id="slogan">Tu Guía a Las Mejores Ofertas</p>
  <div class="lang-switch">
    <button onclick="setLang('es')">ES</button>
    <button onclick="setLang('en')">EN</button>
  </div>
</header>

<div id="content"></div>

<footer>
  <div>© 2025 <strong>OfferView</strong> · Directorio Global de Tiendas</div>
  <div style="margin-top:10px;">
    <a href="privacy.html">Política de Privacidad</a>
    <a href="proxy.html">Proxy Seguro</a>
    <a href="mailto:contacto@offerview.com">Contacto</a>
  </div>
</footer>

<script>
const SECTIONS = {
"Top Stores":[
"Amazon","Alibaba","AliExpress","eBay","Walmart","Target","Costco",
"Burlington","Marshalls","Ross","Miniso","Dollar Tree","Made in China",
"Temu","Shein","Wish","JD","Rakuten","Mercado Libre","Flipkart"
],

"Gaming Stores":[
"Steam","Epic Games","PlayStation","Xbox","Nintendo",
"GameStop","Ubisoft","EA","Blizzard","GOG"
],

"Tecnología Stores":[
"Newegg","B&H","Lenovo","Dell","HP",
"Xiaomi","Asus","Acer","Microsoft","Samsung"
],

"Calzados Stores":[
"Nike","Adidas","Puma","Foot Locker","New Balance",
"Skechers","Reebok","Converse","Vans","Crocs"
],

"Moda Stores":[
"Zara","H&M","Forever 21","Uniqlo","Pull&Bear",
"Bershka","Stradivarius","Fashion Nova","Gap","Old Navy"
],

"Lencería Stores":[
"Victoria’s Secret","Aerie","Calvin Klein","Savage X Fenty","La Senza",
"Intimissimi","Oysho","ThirdLove","Skims","Adore Me"
],

"Salud y Belleza Stores":[
"Sephora","Ulta Beauty","Sally Beauty","The Body Shop","Bath & Body Works",
"L'Oréal","Maybelline","Clinique","Estée Lauder","NYX"
],

"Niños y Juguetería Stores":[
"Toys R Us","Lego","Mattel","Hasbro","Disney Store",
"Fisher-Price","Babylist","Carter’s","OshKosh","Kidpik"
],

"Hoteles y Vuelos":[
"Booking","Expedia","Airbnb","Kayak","Skyscanner",
"Priceline","Agoda","Trip.com","Hotels.com","Travelocity"
]
};

const content=document.getElementById("content");

for(const section in SECTIONS){
  const h=document.createElement("h2");
  h.className="section-title";
  h.textContent=section;
  content.appendChild(h);

  const grid=document.createElement("div");
  grid.className="grid";

  SECTIONS[section].forEach(name=>{
    const a=document.createElement("a");
    a.className="card";
    a.href="#";
    a.textContent=name;
    grid.appendChild(a);
  });

  content.appendChild(grid);
}

const LANG={
es:"Tu Guía a Las Mejores Ofertas",
en:"Your Guide to the Best Deals"
};

function setLang(l){
  document.getElementById("slogan").textContent=LANG[l];
}
</script>

</body>
</html>
