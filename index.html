<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>OfferView – Tu ventana a las mejores ofertas</title>

<meta name="description" content="OfferView reúne las mejores tiendas online del mundo en un solo lugar.">

<!-- GOOGLE ANALYTICS -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-PDM9GCV149"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'G-PDM9GCV149');
</script>

<style>
:root{
  --mamey:#F59E0B;
  --blue1:#0b1f44;
  --blue2:#123a8c;
}

body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:linear-gradient(135deg,var(--blue1),var(--blue2));
  color:#fff;
}

nav{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:18px 30px;
}

.logo{
  font-size:28px;
  font-weight:900;
  color:var(--mamey);
}

.menu a{
  color:#fff;
  margin:0 10px;
  text-decoration:none;
  font-size:14px;
}

.auth span{
  margin-left:15px;
  font-size:14px;
}

.search{
  display:flex;
  justify-content:center;
  margin:30px 20px;
}

.search input{
  width:100%;
  max-width:600px;
  padding:14px 20px;
  border-radius:30px;
  border:none;
}

.lang{
  text-align:center;
  margin-bottom:20px;
}

.lang button{
  background:#1f2f5a;
  color:#fff;
  border:none;
  padding:6px 12px;
  margin:0 5px;
  border-radius:8px;
  cursor:pointer;
}

.section{
  padding:20px 30px 40px;
}

.section h2{
  font-size:24px;
  margin-bottom:18px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:18px;
}

.card{
  position:relative;
  height:140px;
  border-radius:14px;
  overflow:hidden;
  cursor:pointer;
  transition:.3s;
}

.card:hover{transform:translateY(-4px)}

.card img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.overlay{
  position:absolute;
  inset:0;
  background:linear-gradient(90deg,rgba(0,0,0,.7),rgba(0,0,0,.2));
  padding:14px;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
}

.overlay h3{margin:0 0 6px}

.overlay button{
  background:#fff;
  border:none;
  padding:6px 14px;
  border-radius:20px;
  font-size:13px;
  cursor:pointer;
}

footer{
  text-align:center;
  padding:30px;
  background:#0a1630;
  font-size:14px;
}
</style>
</head>

<body>

<nav>
  <div class="logo">OfferView</div>
  <div class="menu">
    <a href="#">Categorías</a>
    <a href="#">Ofertas</a>
    <a href="#">Favoritos</a>
    <a href="#">Blog</a>
  </div>
  <div class="auth">
    <span>Acceder</span>
    <span>Registro</span>
  </div>
</nav>

<div class="search">
  <input placeholder="Buscar tiendas, productos o marcas…">
</div>

<div class="lang">
  <button onclick="setLang('es')">ES</button>
  <button onclick="setLang('en')">EN</button>
</div>

<!-- SECCIONES -->
<div class="section"><h2 id="t1">Top Stores</h2><div class="grid" id="top"></div></div>
<div class="section"><h2 id="t2">Gaming Stores</h2><div class="grid" id="gaming"></div></div>
<div class="section"><h2 id="t3">Technology Stores</h2><div class="grid" id="tech"></div></div>
<div class="section"><h2 id="t4">Shoes Stores</h2><div class="grid" id="shoes"></div></div>
<div class="section"><h2 id="t5">Fashion & Lingerie Stores</h2><div class="grid" id="fashion"></div></div>
<div class="section"><h2 id="t6">Travel Stores</h2><div class="grid" id="travel"></div></div>
<div class="section"><h2 id="t7">Health & Beauty Stores</h2><div class="grid" id="health"></div></div>

<footer>© 2025 OfferView · Directorio Global de Tiendas</footer>

<script>
const IMG="https://i.imgur.com/9YpZP0F.jpg";

const STORES={
top:["Amazon","Alibaba","AliExpress","Temu","eBay","Walmart","Target","IKEA","Costco","JD","Rakuten","Mercado Libre","Flipkart","Samsung","Apple","Nike","Adidas","Zara","Shein","Best Buy"],
gaming:["Steam","Epic Games","PlayStation","Xbox","Nintendo","G2A","Humble Bundle","EA","Ubisoft","Green Man Gaming"],
tech:["Apple","Samsung","Microsoft","Asus","Lenovo","Huawei","Xiaomi","Dell","HP","Newegg"],
shoes:["Nike","Adidas","Puma","Reebok","New Balance","Skechers","Converse","Vans","Anta","Li-Ning"],
fashion:["Zara","H&M","Uniqlo","Shein","Victoria’s Secret","Calvin Klein","Fashion Nova","Aerie","YesStyle","Savage X Fenty"],
travel:["Booking","Expedia","Airbnb","Skyscanner","Kayak","Agoda","Trip.com","Hotels.com","Priceline","Travelocity"],
health:["Sephora","Ulta","Watsons","CVS","Walgreens","Lush","The Body Shop","Kiehl’s","NYX","Douglas"]
};

function render(id,list){
  const box=document.getElementById(id);
  list.forEach(name=>{
    const a=document.createElement("a");
    a.href="https://www.google.com/search?q="+name;
    a.target="_blank";
    a.className="card";
    a.innerHTML=`<img src="${IMG}"><div class="overlay"><h3>${name}</h3><button>Ver ahora</button></div>`;
    box.appendChild(a);
  });
}

Object.keys(STORES).forEach(k=>render(k,STORES[k]));

function setLang(l){
  if(l==="en"){
    t1.textContent="Top Stores";
    t2.textContent="Gaming Stores";
    t3.textContent="Technology Stores";
    t4.textContent="Shoes Stores";
    t5.textContent="Fashion & Lingerie Stores";
    t6.textContent="Travel Stores";
    t7.textContent="Health & Beauty Stores";
  }
}
</script>

</body>
</html>
