<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OfferView – Tu ventana a las mejores ofertas</title>

<style>
:root{
  --mamey:#F59E0B;
  --blue1:#0b1f44;
  --blue2:#123a8c;
}

body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:linear-gradient(135deg,var(--blue1),var(--blue2));
  color:#fff;
}

nav{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:18px 24px;
}

.logo{
  font-size:26px;
  font-weight:900;
  color:var(--mamey);
}

.menu a{
  color:#fff;
  margin:0 8px;
  text-decoration:none;
  font-size:14px;
}

.search{
  display:flex;
  justify-content:center;
  margin:25px 16px;
}

.search input{
  width:100%;
  max-width:600px;
  padding:14px 18px;
  border-radius:30px;
  border:none;
}

.lang{
  text-align:center;
  margin-bottom:20px;
}

.lang button{
  background:#1f2f5a;
  color:#fff;
  border:none;
  padding:6px 14px;
  margin:0 5px;
  border-radius:10px;
}

.section{
  padding:20px 20px 35px;
}

.section h2{
  font-size:22px;
  margin-bottom:16px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:16px;
}

.card{
  height:140px;
  border-radius:16px;
  overflow:hidden;
  position:relative;
  cursor:pointer;
  transition:.25s;
}

.card:hover{transform:translateY(-4px)}

.card svg{
  width:100%;
  height:100%;
}

.overlay{
  position:absolute;
  inset:0;
  background:linear-gradient(90deg,rgba(0,0,0,.65),rgba(0,0,0,.25));
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  padding:14px;
}

.overlay h3{margin:0 0 6px}

.overlay button{
  background:#fff;
  border:none;
  padding:6px 14px;
  border-radius:20px;
  font-size:13px;
}

footer{
  text-align:center;
  padding:28px;
  background:#0a1630;
  font-size:14px;
}
</style>
</head>

<body>

<nav>
  <div class="logo">OfferView</div>
  <div class="menu">
    <a>Categorías</a>
    <a>Ofertas</a>
    <a>Favoritos</a>
    <a>Blog</a>
  </div>
</nav>

<div class="search">
  <input placeholder="Buscar tiendas, productos o marcas…">
</div>

<div class="lang">
  <button>ES</button>
  <button>EN</button>
</div>

<!-- SECCIONES -->
<div class="section"><h2>Top Stores</h2><div class="grid" id="top"></div></div>
<div class="section"><h2>Gaming Stores</h2><div class="grid" id="gaming"></div></div>
<div class="section"><h2>Technology Stores</h2><div class="grid" id="tech"></div></div>
<div class="section"><h2>Shoes Stores</h2><div class="grid" id="shoes"></div></div>
<div class="section"><h2>Fashion & Lingerie Stores</h2><div class="grid" id="fashion"></div></div>
<div class="section"><h2>Travel Stores</h2><div class="grid" id="travel"></div></div>

<footer>© 2025 OfferView · Comparador Global de Tiendas</footer>

<script>
function cardSVG(name){
return `
<svg viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg">
<defs>
<linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
<stop offset="0%" stop-color="#2563eb"/>
<stop offset="100%" stop-color="#0f172a"/>
</linearGradient>
</defs>
<rect width="400" height="200" fill="url(#g)"/>
<text x="20" y="110" font-size="36" fill="white" font-weight="700">${name}</text>
</svg>`;
}

const STORES={
top:["Amazon","Alibaba","AliExpress","eBay","Walmart","Temu","Mercado Libre","Rakuten","JD","Target",
     "IKEA","Costco","Flipkart","Best Buy","Newegg","Shopify","Etsy","Shopee","Lazada","Carrefour"],

gaming:["Steam","Epic Games","PlayStation","Xbox","Nintendo","Ubisoft","EA","G2A","Humble Bundle","Riot Games"],

tech:["Apple","Samsung","Microsoft","Dell","HP","Asus","Lenovo","Xiaomi","Huawei","Sony"],

shoes:["Nike","Adidas","Puma","Reebok","New Balance","Skechers","Converse","Vans","Anta","Li-Ning"],

fashion:["Zara","H&M","Uniqlo","Shein","Victoria’s Secret","Calvin Klein","Fashion Nova","Aerie","Savage X Fenty","YesStyle"],

travel:["Booking","Expedia","Airbnb","Skyscanner","Agoda","Kayak","Trip.com","Hotels.com","Priceline","Travelocity"]
};

function render(id,list){
  const box=document.getElementById(id);
  list.forEach(name=>{
    const a=document.createElement("a");
    a.href="https://www.google.com/search?q="+name;
    a.target="_blank";
    a.className="card";
    a.innerHTML=cardSVG(name)+`<div class="overlay"><h3>${name}</h3><button>Ver ahora</button></div>`;
    box.appendChild(a);
  });
}

Object.keys(STORES).forEach(k=>render(k,STORES[k]));
</script>

</body>
</html>
