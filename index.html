/* ================= PUBLICAR IMAGEN (ULTRA PRO + ESCALABLE) ================= */
function publicarImagen(e){
  e.preventDefault();

  if(!auth.currentUser){
    alert("Debes iniciar sesión para publicar");
    return;
  }

  const fileInput = document.getElementById("imagenOferta");
  const file = fileInput.files[0];
  const linkOferta = document.getElementById("linkOferta").value.trim();
  const descripcion = document.getElementById("descOferta").value.trim();
  
  if(!file){
    alert("Debes subir una imagen");
    return;
  }

  // 🔥 VALIDAR TIPO
  if(!file.type.startsWith("image/")){
    alert("Solo se permiten imágenes");
    return;
  }

  // 🔥 VALIDAR TAMAÑO (máx 5MB)
  if(file.size > 5 * 1024 * 1024){
    alert("La imagen es demasiado pesada (máx 5MB)");
    return;
  }

  const canvas = document.createElement("canvas");
  const ctx = canvas.getContext("2d");
  const img = new Image();

  img.onload = function(){

  const MAX = 1080;

  let w = img.width;
  let h = img.height;

  if(w > h){
    if(w > MAX){
      h *= MAX / w;
      w = MAX;
    }
  } else {
    if(h > MAX){
      w *= MAX / h;
      h = MAX;
    }
  }

  canvas.width = w;
  canvas.height = h;

  ctx.drawImage(img, 0, 0, w, h);

  let calidad = 0.85;
  if(file.size > 3 * 1024 * 1024){
    calidad = 0.75;
  }

  canvas.toBlob(blob => {

    if(!blob){
      alert("Error procesando la imagen");
      return;
    }

    const formData = new FormData();
    const fileName = `oferta_${Date.now()}.webp`;

    formData.append("file", blob, fileName);
    formData.append("upload_preset", "ofertas_publicas");

    fetch("https://api.cloudinary.com/v1_1/dveqauvqh/image/upload", {
      method: "POST",
      body: formData
    })
    .then(res => res.json())
    .then(data => {

      if(!data.secure_url){
        alert("Error al subir la imagen");
        return;
      }

      return db.collection("publicidad").add({
        imagen: data.secure_url,
        link: linkOferta || null,
        descripcion: descripcion || "",
        uid: auth.currentUser.uid,
        fecha: firebase.firestore.FieldValue.serverTimestamp()
      });

    })
    .then(()=>{
      closeOfferModal();
      alert("Imagen publicada correctamente ✅");

      fileInput.value = "";
      document.getElementById("linkOferta").value = "";
      document.getElementById("descOferta").value = "";
    })
    .catch(err=>{
      console.error(err);
      alert("Error al subir la imagen");
    });

  }, "image/webp", calidad);

}; // ✅ ESTE CIERRA onload CORRECTAMENTE

/* ================= CARRUSEL RR OPTIMIZADO ================= */
function loadAds(){

  db.collection("publicidad")
  .orderBy("fecha","desc")
  .onSnapshot(snapshot => {

    const adCarousel = document.getElementById("adCarousel");
    adCarousel.innerHTML = "";

    snapshot.forEach(doc => {

      const data = doc.data();
      const postId = doc.id;

      const card = document.createElement("div");
      card.className = "offer-card";

      const imageContainer = document.createElement("div");
      imageContainer.className = "offer-image-container";

      const img = document.createElement("img");
img.className = "offer-image";

// 🔥 Optimización automática desde Cloudinary
img.src = data.imagen.replace(
  "/upload/",
  "/upload/f_auto,q_auto,w_800/"
);

// 🚀 Mejora de rendimiento
img.loading = "lazy";
img.decoding = "async";

// 🧠 Mejora visual extra
img.style.imageRendering = "auto";
     
      if(data.link){
        const link = document.createElement("a");
        link.href = data.link;
        link.target = "_blank";
        link.appendChild(img);
        imageContainer.appendChild(link);
      }else{
        imageContainer.appendChild(img);
      }

      card.appendChild(imageContainer);
      
      if(data.descripcion){
  const desc = document.createElement("p");
  desc.textContent = data.descripcion;
  desc.style.padding = "8px";
  desc.style.fontSize = "14px";
  card.appendChild(desc);
  }
     
// ACCIONES (ELIMINAR + EDITAR)
if(auth.currentUser && (auth.currentUser.uid === data.uid || esAdmin(auth.currentUser))){

  // 🔥 BOTÓN EDITAR
  const editBtn = document.createElement("button");
  editBtn.textContent = "✏️";
  editBtn.className = "edit-btn";
  editBtn.onclick = () => editarOferta(postId, data);
  card.appendChild(editBtn);

  // ❌ BOTÓN ELIMINAR
  const deleteBtn = document.createElement("button");
  deleteBtn.className = "delete-btn";
  deleteBtn.innerHTML = "✖";
  deleteBtn.onclick = () => eliminarOferta(postId);
  card.appendChild(deleteBtn);
}
     
      // LIKE
      const likeBox = document.createElement("div");
      likeBox.className = "like-box";
      likeBox.innerHTML = `❤️ <span id="likes-${postId}">0</span>`;
      likeBox.onclick = () => toggleLike(postId);

      card.appendChild(likeBox);
      adCarousel.appendChild(card);

      // contador likes
      db.collection("likes")
      .where("postId","==",postId)
      .onSnapshot(likesSnapshot => {
        const likesEl = document.getElementById("likes-"+postId);
        if(likesEl){
          likesEl.textContent = likesSnapshot.size;
        }
      });

    });

  });

}
    

/* ================= LIKE SISTEMA RR ================= */
function toggleLike(postId){

if(!auth.currentUser){
alert("Debes iniciar sesión para dar like");
return;
}

const uid = auth.currentUser.uid;

const likeRef = db.collection("likes")
.where("postId","==",postId)
.where("uid","==",uid);

likeRef.get().then(snapshot=>{
if(snapshot.empty){
db.collection("likes").add({
postId: postId,
uid: uid,
fecha: firebase.firestore.FieldValue.serverTimestamp()
});
}else{
snapshot.forEach(doc=>{
doc.ref.delete();
});
}
});

}

/* ================= RENDER STORE CARDS ================= */
function renderStoreCards(){

  const carousel = document.getElementById("storesCarousel");
  carousel.innerHTML = "";

  // 🔥 TODAS LAS TIENDAS DE TODOS LOS MÓDULOS
  const allStores = Object.values(SECTIONS).flat();

  // 🔥 AGRUPAR DE 6 EN 6
  for(let i = 0; i < allStores.length; i += 6){

    const page = document.createElement("div");
    page.className = "stores-page";

    const group = allStores.slice(i, i + 6);

    group.forEach(store => {

      const item = document.createElement("div");
      item.className = "store-chip " + store[1];
      item.textContent = store[0];

      item.onclick = () => {
        window.open(store[2], "_blank");
      };

      page.appendChild(item);

    });

    carousel.appendChild(page);
  }
}

/* ========= AUTO CARRUSEL STORES ========= */
   
window.addEventListener("load", function(){

  const carousel = document.getElementById("storesCarousel");

  document.addEventListener("click", function(e){

    // 🔥 Validar que sea el botón correcto
    if(!e.target.classList.contains("expand-btn")) return;

    const card = e.target.closest(".store-card");

    // 🔥 Evita error si no encuentra card
    if(!card) return;

    const lists = card.querySelectorAll(".store-list");

    // 🔥 Validar que exista el segundo bloque
    if(lists.length < 2) return;

    const hiddenList = lists[1];

    // 🔥 Toggle limpio
    const isVisible = hiddenList.style.display === "block";

    if(isVisible){
      hiddenList.style.display = "none";
      e.target.textContent = "+";
    }else{
      hiddenList.style.display = "block";
      e.target.textContent = "-";
    }

  });

});
/* ================= MENU HAMBURGUESA ================= */
function toggleMenu() {
  const menu = document.getElementById("sideMenu");
  const overlay = document.getElementById("overlay");

  const isOpen = menu.classList.contains("active");

  if (isOpen) {
    menu.classList.remove("active");
    overlay.classList.remove("active");
  } else {
    menu.classList.add("active");
    overlay.classList.add("active");
  }
}

// ================= ABRIR MIS OFERTAS =================
async function abrirMisOfertas() {
  if (!auth.currentUser) {
    alert("Debes iniciar sesión");
    return;
  }

  // ✅ Evitar múltiples modales
  const modalExistente = document.querySelector(".modal-edicion");
  if (modalExistente) modalExistente.remove();

  const modal = document.createElement("div");
  modal.className = "modal-edicion";
  modal.innerHTML = `
    <div class="modal-contenido" style="max-width:1000px; width:95%; max-height:90vh; overflow:auto;">
      <h2>📸 Mis Ofertas</h2>
      <button onclick="this.closest('.modal-edicion').remove()">❌</button>
      <div id="misOfertasGrid">Cargando...</div>
    </div>
  `;

  document.body.appendChild(modal);

  const grid = document.getElementById("misOfertasGrid");

  db.collection("publicidad")
    .where("uid", "==", auth.currentUser.uid)
    .orderBy("fecha", "desc")
    .onSnapshot(snapshot => {

      if (snapshot.empty) {
        grid.innerHTML = "No tienes ofertas";
        return;
      }

      grid.innerHTML = "";

      snapshot.forEach(doc => {
        const data = doc.data();
        const id = doc.id;

        // ✅ Compatible con cualquier imagen
        const img = data.imagen || "";

        const card = document.createElement("div");
        card.className = "mi-oferta-card";

        card.innerHTML = `
          <div class="mi-oferta-imagen">
            <img src="${img}">
          </div>

          <div class="mi-oferta-info">
            <p>${data.descripcion || "Sin descripción"}</p>

            <div>❤️ <span id="likes-${id}">0</span></div>

            <div class="acciones-botones">
              <button class="btn-editar-oferta" onclick="editarOfertaModal('${id}', \`${data.descripcion || ""}\`)">Editar</button>
              <button class="btn-eliminar-oferta" onclick="eliminarOfertaConfirmacion('${id}')">Eliminar</button>
            </div>
          </div>
        `;

        grid.appendChild(card);

        // likes en tiempo real
        db.collection("likes")
          .where("postId", "==", id)
          .onSnapshot(likes => {
            const el = document.getElementById(`likes-${id}`);
            if (el) el.textContent = likes.size;
          });

      });
    });
}

// ================= EDITAR =================
function editarOfertaModal(id, desc) {

  const modal = document.createElement("div");
  modal.className = "modal-edicion";

  modal.innerHTML = `
    <div class="modal-contenido">
      <h3>Editar</h3>
      <textarea id="editDesc">${desc}</textarea>
      <button onclick="guardarEdicionOferta('${id}')">Guardar</button>
      <button onclick="this.closest('.modal-edicion').remove()">Cancelar</button>
    </div>
  `;

  document.body.appendChild(modal);
}

// ================= GUARDAR =================
async function guardarEdicionOferta(id) {

  const nueva = document.getElementById("editDesc").value;

  if (!nueva) return alert("Vacío");

  await db.collection("publicidad").doc(id).update({
    descripcion: nueva
  });

  document.querySelectorAll(".modal-edicion")[1]?.remove();

  mostrarNotificacion("Editado", "success");
}

// ================= ELIMINAR =================
function eliminarOfertaConfirmacion(id) {

  if (!confirm("Eliminar oferta?")) return;

  eliminarOfertaDefinitiva(id);
}

// ================= ELIMINAR FINAL =================
async function eliminarOfertaDefinitiva(id) {

  const docRef = db.collection("publicidad").doc(id);

  const likes = await db.collection("likes")
    .where("postId", "==", id).get();

  const batch = db.batch();

  likes.forEach(l => batch.delete(l.ref));

  batch.delete(docRef);

  await batch.commit();

  mostrarNotificacion("Eliminado", "success");
}

// ================= NOTIFICACIONES =================
function mostrarNotificacion(msg) {
  const n = document.createElement("div");

  n.innerText = msg;
  n.style = `
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    background:black;
    color:white;
    padding:10px 20px;
    border-radius:20px;
    z-index:99999;
  `;

  document.body.appendChild(n);

  setTimeout(() => n.remove(), 2000);
}
