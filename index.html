<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>OfferView – Tu Guía a las Mejores Ofertas</title>

<meta name="description" content="OfferView es una guía global de tiendas online con inteligencia artificial, filtrado por país e idiomas.">
<meta name="keywords" content="ofertas, tiendas online, Amazon, AliExpress, compras, descuentos, RD">
<meta name="author" content="OfferView">
<meta name="robots" content="index, follow">

<!-- Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-PDM9GCV149"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'G-PDM9GCV149');
</script>

<style>
:root{
  --mamey:#F59E0B;
  --bg:#F9FAFB;
  --card:#ffffff;
  --text:#111827;
}
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
}
header{
  text-align:center;
  padding:45px 15px;
  background:#0b1633;
  color:#fff;
}
header h1{
  color:var(--mamey);
  font-size:42px;
  margin:0;
}
header p{margin:6px 0;}
.views{margin-top:8px;font-size:14px;}
.search-box{margin:25px auto;max-width:520px;}
.search-box form{display:flex;}
.search-box input{
  flex:1;
  padding:12px;
  border:none;
  border-radius:10px 0 0 10px;
}
.search-box button{
  padding:12px 18px;
  border:none;
  background:var(--mamey);
  font-weight:bold;
  border-radius:0 10px 10px 0;
  cursor:pointer;
}
.selectors{
  margin-top:15px;
}
select{
  padding:6px 10px;
  border-radius:8px;
  border:none;
  margin:0 5px;
}
.section-title{
  text-align:center;
  margin:50px 0 22px;
  font-size:26px;
  font-weight:700;
  color:var(--mamey);
}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:20px;
  padding:0 20px 40px;
}
.card{
  background:var(--card);
  border-radius:18px;
  padding:20px 15px;
  text-align:center;
  text-decoration:none;
  color:var(--text);
  box-shadow:0 10px 25px rgba(0,0,0,.08);
  transition:.25s;
}
.card:hover{transform:translateY(-6px);}
.card img{
  width:70px;
  height:70px;
  object-fit:contain;
  margin-bottom:10px;
}
footer{
  background:#eef2f7;
  padding:40px 15px;
  text-align:center;
  font-size:14px;
}
</style>
</head>

<body>

<header>
  <h1>OFFERVIEW</h1>
  <p id="slogan">Tu Guía a las Mejores Ofertas</p>
  <div class="views" id="viewsCounter">Views: 0</div>

  <div class="search-box">
    <form onsubmit="return OfferViewIA.search(event)">
      <input id="searchInput" placeholder="Buscar tiendas, marcas u ofertas">
      <button type="submit">Buscar</button>
    </form>
  </div>

  <div class="selectors">
    <select id="countrySelect" onchange="OfferViewIA.setCountry(this.value)">
      <option value="RD">República Dominicana</option>
      <option value="US">Estados Unidos</option>
      <option value="MX">México</option>
      <option value="ES">España</option>
      <option value="BR">Brasil</option>
      <option value="IN">India</option>
      <option value="RU">Rusia</option>
      <option value="FR">Francia</option>
      <option value="DE">Alemania</option>
      <option value="JP">Japón</option>
    </select>

    <select id="langSelect" onchange="setLang(this.value)">
      <option value="es">Español</option>
      <option value="en">English</option>
      <option value="pt">Português</option>
      <option value="fr">Français</option>
      <option value="de">Deutsch</option>
    </select>
  </div>
</header>

<div id="content"></div>

<footer>
  <p>
    OfferView es una guía informativa e independiente.  
    Algunos enlaces pueden ser de afiliación.  
    Las marcas y logotipos pertenecen a sus respectivos dueños.
  </p>
  <p>© 2025 <strong>OfferView</strong></p>
</footer>

<script>
/* ================= CONTADOR DE VISTAS ================= */
const START_VIEWS = 25104;
let views = localStorage.getItem("offerview_views");
views = views ? parseInt(views) + 1 : START_VIEWS;
localStorage.setItem("offerview_views", views);
document.getElementById("viewsCounter").textContent =
  "Views: " + views.toLocaleString();

/* ================= ICONOS ================= */
const ICON = n =>
  `https://cdn.jsdelivr.net/npm/simple-icons@v11/icons/${n}.svg`;

/* ================= SECCIONES Y TIENDAS (2B FINAL) ================= */
const SECTIONS = {
  "Top Stores":[
    ["Amazon","amazon","https://www.amazon.com"],
    ["AliExpress","aliexpress","https://www.aliexpress.com"],
    ["Alibaba","alibaba","https://www.alibaba.com"],
    ["Flipkart","flipkart","https://www.flipkart.com"],
    ["Temu","temu","https://www.temu.com"],
    ["eBay","ebay","https://www.ebay.com"],
    ["Walmart","walmart","https://www.walmart.com"],
    ["Target","target","https://www.target.com"],
    ["Costco","costco","https://www.costco.com"],
    ["IKEA","ikea","https://www.ikea.com"],
    ["Mercado Libre","mercadolibre","https://www.mercadolibre.com"],
    ["JD","jd","https://www.jd.com"],
    ["Rakuten","rakuten","https://www.rakuten.com"],
    ["Ross","ross","https://www.rossstores.com"],
    ["Marshalls","marshalls","https://www.marshalls.com"],
    ["Burlington","burlington","https://www.burlington.com"],
    ["Dollar Tree","dollartree","https://www.dollartree.com"],
    ["Miniso","miniso","https://www.miniso.com"],
    ["Carrefour","carrefour","https://www.carrefour.com"],
    ["Tesco","tesco","https://www.tesco.com"],
    ["Ozon","ozon","https://www.ozon.ru"],
    ["Wildberries","wildberries","https://www.wildberries.ru"],
    ["Best Buy","bestbuy","https://www.bestbuy.com"],
    ["Home Depot","homedepot","https://www.homedepot.com"]
  ],

  "Gaming Stores":[
    ["Steam","steam","https://store.steampowered.com"],
    ["Epic Games","epicgames","https://store.epicgames.com"],
    ["PlayStation","playstation","https://store.playstation.com"],
    ["Xbox","xbox","https://www.xbox.com/store"],
    ["Nintendo","nintendo","https://www.nintendo.com/store"],
    ["GameStop","gamestop","https://www.gamestop.com"],
    ["Ubisoft","ubisoft","https://store.ubisoft.com"],
    ["EA","ea","https://www.ea.com"],
    ["Blizzard","blizzard","https://www.blizzard.com"],
    ["GOG","gog","https://www.gog.com"]
  ],

  "Tecnología Stores":[
    ["Apple","apple","https://www.apple.com"],
    ["Samsung","samsung","https://www.samsung.com"],
    ["Microsoft","microsoft","https://www.microsoft.com"],
    ["Lenovo","lenovo","https://www.lenovo.com"],
    ["Dell","dell","https://www.dell.com"],
    ["HP","hp","https://www.hp.com"],
    ["Asus","asus","https://www.asus.com"],
    ["Acer","acer","https://www.acer.com"],
    ["Xiaomi","xiaomi","https://www.mi.com"],
    ["Newegg","newegg","https://www.newegg.com"]
  ],

  "Moda & Lencería Stores":[
    ["Zara","zara","https://www.zara.com"],
    ["H&M","hm","https://www.hm.com"],
    ["Uniqlo","uniqlo","https://www.uniqlo.com"],
    ["Shein","shein","https://www.shein.com"],
    ["Fashion Nova","fashionnova","https://www.fashionnova.com"],
    ["Victoria’s Secret","victoriassecret","https://www.victoriassecret.com"],
    ["Aerie","aerie","https://www.ae.com"],
    ["Calvin Klein","calvinklein","https://www.calvinklein.com"],
    ["Savage X Fenty","savagexfenty","https://www.savagex.com"],
    ["Oysho","oysho","https://www.oysho.com"]
  ],

  "Calzados Stores":[
    ["Nike","nike","https://www.nike.com"],
    ["Adidas","adidas","https://www.adidas.com"],
    ["Puma","puma","https://www.puma.com"],
    ["New Balance","newbalance","https://www.newbalance.com"],
    ["Reebok","reebok","https://www.reebok.com"],
    ["Skechers","skechers","https://www.skechers.com"],
    ["Converse","converse","https://www.converse.com"],
    ["Vans","vans","https://www.vans.com"],
    ["Crocs","crocs","https://www.crocs.com"],
    ["Under Armour","underarmour","https://www.underarmour.com"]
  ],

  "Hoteles y Vuelos Stores":[
    ["Booking","booking","https://www.booking.com"],
    ["Expedia","expedia","https://www.expedia.com"],
    ["Airbnb","airbnb","https://www.airbnb.com"],
    ["Kayak","kayak","https://www.kayak.com"],
    ["Skyscanner","skyscanner","https://www.skyscanner.com"],
    ["Agoda","agoda","https://www.agoda.com"],
    ["Trip.com","tripdotcom","https://www.trip.com"],
    ["Hotels.com","hotelsdotcom","https://www.hotels.com"],
    ["Priceline","priceline","https://www.priceline.com"],
    ["Travelocity","travelocity","https://www.travelocity.com"]
  ]
};

/* ================= RENDER ================= */
const content = document.getElementById("content");
for(const section in SECTIONS){
  const h = document.createElement("h2");
  h.className = "section-title";
  h.textContent = section;
  content.appendChild(h);

  const grid = document.createElement("div");
  grid.className = "grid";

  SECTIONS[section].forEach(s=>{
    const a = document.createElement("a");
    a.className = "card";
    a.href = OfferViewIA.affiliate(s[2]);
    a.target = "_blank";
    a.innerHTML = `<img src="${ICON(s[1])}"><span>${s[0]}</span>`;
    grid.appendChild(a);
  });

  content.appendChild(grid);
}

/* ================= PROMPTS OFICIALES ================= */
const OfferViewPrompts = {
  search:"Analiza la búsqueda del usuario",
  intent:"Detecta intención de compra",
  recommend:"Recomienda tiendas confiables",
  deals:"Prioriza descuentos",
  location:"Filtra por país",
  trends:"Detecta tendencias",
  personalize:"Personaliza resultados",
  monetize:"Afiliación ética",
  ethics:"Guía independiente"
};

/* ================= IA OFFERVIEW ================= */
const OfferViewIA = {
  country:"RD",
  prompts:OfferViewPrompts,

  setCountry(c){
    this.country = c;
    console.log("🌍 País seleccionado:",c);
  },

  search(e){
    e.preventDefault();
    const q = document.getElementById("searchInput").value;
    window.open(
      `https://www.google.com/search?q=${encodeURIComponent(q+" ofertas "+this.country)}`,
      "_blank"
    );
  },

  affiliate(url){
    if(url.includes("amazon")) return url+"?tag=offerview-20";
    if(url.includes("aliexpress")) return url+"?aff=offerview";
    return url;
  }
};

/* ================= IDIOMAS ================= */
const LANG = {
  es:"Tu Guía a las Mejores Ofertas",
  en:"Your Guide to the Best Deals",
  pt:"Seu Guia para as Melhores Ofertas",
  fr:"Votre Guide des Meilleures Offres",
  de:"Ihr Leitfaden für die besten Angebote"
};
function setLang(l){
  document.getElementById("slogan").textContent = LANG[l];
}

console.log("🤖 OfferView 2B cargado correctamente");
</script>

</body>
</html>
