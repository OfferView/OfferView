<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OfferView – Tu Guía a Las Mejores Ofertas</title>

<meta name="description" content="OfferView es un directorio global que te guía a las mejores ofertas del mundo.">
<meta name="author" content="OfferView">

<style>
:root{
  --mamey:#F59E0B;
  --blue1:#0f2a5f;
  --blue2:#0b3a82;
  --card-radius:22px;
}

body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto;
  background:linear-gradient(180deg,#0b1633,#0e1f4d);
  color:#fff;
}

/* HEADER */
header{
  padding:40px 20px 60px;
  text-align:center;
}

header h1{
  color:var(--mamey);
  font-size:40px;
  margin:0;
}

header p{
  opacity:.9;
  margin-top:8px;
}

/* SECTIONS */
.section{
  padding:10px 20px 50px;
}

.section h2{
  margin:30px 0 20px;
  font-size:26px;
  color:#fff;
  border-bottom:1px solid rgba(255,255,255,.15);
  padding-bottom:10px;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
  gap:20px;
}

/* CARD BANNER */
.card{
  position:relative;
  border-radius:var(--card-radius);
  padding:22px;
  height:150px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  text-decoration:none;
  color:#fff;
  background:linear-gradient(135deg,var(--blue2),var(--blue1));
  box-shadow:0 15px 35px rgba(0,0,0,.35);
  transition:.3s ease;
  overflow:hidden;
}

.card::after{
  content:"";
  position:absolute;
  inset:0;
  background:radial-gradient(circle at top right,rgba(255,255,255,.15),transparent 60%);
}

.card:hover{
  transform:translateY(-6px) scale(1.02);
}

.card strong{
  font-size:22px;
  z-index:1;
}

.card span{
  background:#fff;
  color:#000;
  width:max-content;
  padding:6px 14px;
  border-radius:999px;
  font-size:13px;
  font-weight:600;
  z-index:1;
}

/* FOOTER */
footer{
  background:#070f26;
  padding:40px 20px;
  text-align:center;
  font-size:14px;
  opacity:.85;
}
</style>
</head>

<body>

<header>
  <h1>OfferView</h1>
  <p>Tu Guía a Las Mejores Ofertas</p>
</header>

<div id="app"></div>

<footer>
© 2025 OfferView · Directorio Global de Tiendas  
<br>Contacto · Privacidad · Términos
</footer>

<script>
const DATA = {
"Top Stores":[
["Amazon","amazon.com"],["Alibaba","alibaba.com"],["AliExpress","aliexpress.com"],
["eBay","ebay.com"],["Walmart","walmart.com"],["Target","target.com"],
["Best Buy","bestbuy.com"],["Costco","costco.com"],["Burlington","burlington.com"],
["Marshalls","marshalls.com"],["Ross","rossstores.com"],["Miniso","miniso.com"],
["Dollar Tree","dollartree.com"],["Made in China","made-in-china.com"],
["Temu","temu.com"],["Shein","shein.com"],["Wish","wish.com"],
["JD","jd.com"],["Rakuten","rakuten.com"],["Mercado Libre","mercadolibre.com"]
],

"Gaming Stores":[
["Steam","steampowered.com"],["Epic Games","epicgames.com"],
["PlayStation","playstation.com"],["Xbox","xbox.com"],
["Nintendo","nintendo.com"],["GameStop","gamestop.com"],
["Ubisoft","ubisoft.com"],["EA","ea.com"],
["Blizzard","blizzard.com"],["GOG","gog.com"]
],

"Moda Stores":[
["Zara","zara.com"],["H&M","hm.com"],["Forever 21","forever21.com"],
["Uniqlo","uniqlo.com"],["Pull&Bear","pullandbear.com"],
["Bershka","bershka.com"],["Stradivarius","stradivarius.com"],
["Fashion Nova","fashionnova.com"],["Gap","gap.com"],["Old Navy","oldnavy.com"]
],

"Lencería Stores":[
["Victoria’s Secret","victoriassecret.com"],["Aerie","aerie.com"],
["Calvin Klein","calvinklein.com"],["Savage X Fenty","savagex.com"],
["La Senza","lasenza.com"],["Intimissimi","intimissimi.com"],
["Oysho","oysho.com"],["ThirdLove","thirdlove.com"],
["Skims","skims.com"],["Adore Me","adoreme.com"]
],

"Calzados Stores":[
["Nike","nike.com"],["Adidas","adidas.com"],["Puma","puma.com"],
["Foot Locker","footlocker.com"],["New Balance","newbalance.com"],
["Skechers","skechers.com"],["Reebok","reebok.com"],
["Converse","converse.com"],["Vans","vans.com"],["Crocs","crocs.com"]
],

"Tecnología Stores":[
["Newegg","newegg.com"],["B&H","bhphotovideo.com"],
["Dell","dell.com"],["HP","hp.com"],
["Lenovo","lenovo.com"],["Asus","asus.com"],
["Acer","acer.com"],["Xiaomi","mi.com"],
["Microsoft","microsoft.com"],["Samsung","samsung.com"]
],

"Salud y Belleza Stores":[
["Sephora","sephora.com"],["Ulta Beauty","ulta.com"],
["Bath & Body Works","bathandbodyworks.com"],["The Body Shop","thebodyshop.com"],
["L'Oréal","loreal.com"],["Maybelline","maybelline.com"],
["Clinique","clinique.com"],["Estée Lauder","esteelauder.com"],
["NYX","nyxcosmetics.com"],["Sally Beauty","sallybeauty.com"]
],

"Niños y Juguetería Stores":[
["Lego","lego.com"],["Mattel","mattel.com"],["Hasbro","hasbro.com"],
["Disney Store","shopdisney.com"],["Toys R Us","toysrus.com"],
["Fisher-Price","fisher-price.com"],["Carter’s","carters.com"],
["OshKosh","oshkosh.com"],["Babylist","babylist.com"],["Kidpik","kidpik.com"]
],

"Hoteles y Vuelos Stores":[
["Booking","booking.com"],["Expedia","expedia.com"],
["Airbnb","airbnb.com"],["Kayak","kayak.com"],
["Skyscanner","skyscanner.com"],["Priceline","priceline.com"],
["Agoda","agoda.com"],["Hotels.com","hotels.com"],
["Trip.com","trip.com"],["Travelocity","travelocity.com"]
]
};

const app=document.getElementById("app");

for(const section in DATA){
  const s=document.createElement("div");
  s.className="section";
  s.innerHTML=`<h2>${section}</h2><div class="grid"></div>`;
  const grid=s.querySelector(".grid");

  DATA[section].forEach(t=>{
    const a=document.createElement("a");
    a.className="card";
    a.href="https://"+t[1];
    a.target="_blank";
    a.innerHTML=`<strong>${t[0]}</strong><span>Explorar</span>`;
    grid.appendChild(a);
  });

  app.appendChild(s);
}
</script>

</body>
</html>
