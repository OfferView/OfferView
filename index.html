<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OfferView – Directorio Global de Tiendas</title>

<meta name="description" content="OfferView reúne las tiendas más visitadas del mundo en un solo lugar.">
<meta name="keywords" content="ofertas, tiendas online, compras, ecommerce">
<meta name="author" content="OfferView">

<style>
:root{
  --mamey:#F59E0B;
  --blue:#2563EB;
  --bg:#0b1220;
  --card:#ffffff;
}
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#0b1220;
  color:#fff;
  overflow-x:hidden;
}
body::before{
  content:"";
  position:fixed;
  inset:0;
  background:linear-gradient(270deg,#0b1220,#1e293b,#0b1220);
  background-size:600% 600%;
  animation:bg 20s ease infinite;
  z-index:-1;
}
@keyframes bg{
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}
header{
  text-align:center;
  padding:50px 15px;
}
header h1{
  color:var(--mamey);
  font-size:42px;
  margin:0;
}
header p{
  margin:8px 0 0;
  opacity:.85;
}
.lang-switch button{
  margin:15px 5px 0;
  padding:6px 14px;
  border:none;
  border-radius:10px;
  background:#1f2937;
  color:#fff;
  cursor:pointer;
}
.section-title{
  text-align:center;
  color:var(--mamey);
  margin:50px 0 20px;
  font-size:26px;
}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:18px;
  padding:0 20px 40px;
}
.card{
  background:var(--card);
  color:#111;
  padding:18px;
  border-radius:16px;
  text-align:center;
  font-weight:700;
  text-decoration:none;
  transition:.25s;
}
.card:hover{
  background:var(--mamey);
  color:#fff;
  transform:translateY(-4px);
}
footer{
  text-align:center;
  padding:30px;
  background:#020617;
  font-size:14px;
}
</style>
</head>

<body>

<header>
  <h1>OFFERVIEW</h1>
  <p id="slogan">Tu Ventana a las Mejores Ofertas</p>
  <div class="lang-switch">
    <button onclick="setLang('es')">ES</button>
    <button onclick="setLang('en')">EN</button>
  </div>
</header>

<h2 class="section-title">Top Stores</h2>
<div class="grid" id="top"></div>

<h2 class="section-title">Gaming Stores</h2>
<div class="grid" id="gaming"></div>

<h2 class="section-title">Technology Stores</h2>
<div class="grid" id="tech"></div>

<h2 class="section-title">Shoes Stores</h2>
<div class="grid" id="shoes"></div>

<h2 class="section-title">Fashion & Lingerie Stores</h2>
<div class="grid" id="fashion"></div>

<h2 class="section-title">Travel Stores</h2>
<div class="grid" id="travel"></div>

<h2 class="section-title">Health & Beauty Stores</h2>
<div class="grid" id="health"></div>

<footer>
© 2025 <strong>OfferView</strong> · Directorio Global de Tiendas
</footer>

<script>

function render(id){
  const box=document.getElementById(id);
  STORES[id].forEach(s=>{
    const a=document.createElement("a");
    a.href=s[1];
    a.target="_blank";
    a.className="card";
    a.textContent=s[0];
    box.appendChild(a);
  });
}
Object.keys(STORES).forEach(render);

const LANG={
es:{slogan:"Tu Ventana a las Mejores Ofertas"},
en:{slogan:"Your Window to the Best Deals"}
};
function setLang(l){
  document.getElementById("slogan").textContent=LANG[l].slogan;
}
</script>

</html>
